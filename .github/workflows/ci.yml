name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: ruff
        run: ruff check .
      - name: black --check
        run: black --check .

  lint-ansible:
    runs-on: ubuntu-latest
    # Cost/signal not yet measured (open question,
    # 2026-07-24-fleet-open-source-release-design.md §10) — kept
    # non-blocking until confirmed worth promoting to a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install infra extras
        run: pip install -e ".[infra]"
      - name: ansible-lint
        run: ansible-lint ansible/
      - name: yamllint
        run: yamllint ansible/
