framework:
    messenger:
        failure_transport: failed

        transports:
            # Both live in queue.sqlite (the `queue` Doctrine connection); created by messenger:setup-transports.
            # redeliver_timeout > the longest job (DriftCheck/ProvisionJob::TIMEOUT 3700 s; Doctrine's default is 3600 s, after
            # which a message still being handled counts as lost and is delivered again). Pinned by JobTimeoutsTest.
            jobs:
                dsn: 'doctrine://queue?queue_name=jobs&auto_setup=false&redeliver_timeout=7200'
                retry_strategy:
                    max_retries: 0
            failed:
                dsn: 'doctrine://queue?queue_name=failed&auto_setup=false'

        routing:
            App\Message\RunJob: jobs

# In dev and test a click runs the job inside the request (with the recording command runner); prod uses the queue.
when@dev:
    framework:
        messenger:
            transports:
                jobs: 'sync://'

when@test:
    framework:
        messenger:
            transports:
                jobs: 'sync://'
