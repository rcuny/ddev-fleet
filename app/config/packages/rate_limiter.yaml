framework:
    rate_limiter:
        # Guesses at the one-time setup token (App\Setup\SetupAttemptLimiter), per client address.
        setup_token:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Reveals of a secret value (App\Fleet\Secrets\RevealThrottle), per signed-in user. A refusal is audited.
        secret_reveal:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Password re-entries on the re-auth page (App\Security\Reauth\ReauthService), per signed-in user.
        reauth:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # "Check now" on the Upgrade page (App\Fleet\Upgrade\CheckNowThrottle), per signed-in user: it asks GitHub.
        upgrade_check:
            policy: sliding_window
            limit: 1
            interval: '1 minute'
        # The token API (App\Api\Http\ApiSubscriber), per token: reads and writes have their own pool.
        api_read:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        api_write:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Terminal reads (v1.8.0), per token, on top of api_read: a capture is heavier than a database read.
        api_terminal_read:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Terminal input (v1.8.0), per token, stricter than any other write.
        api_terminal_write:
            policy: sliding_window
            limit: 6
            interval: '1 minute'
        # ... and at most one input every 2 seconds (no burst of six).
        api_terminal_write_burst:
            policy: sliding_window
            limit: 1
            interval: '2 seconds'
        # ... at most 10 inputs a minute into one instance whatever the token, so several tokens cannot flood one agent pane.
        api_terminal_write_instance:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # ... and at most 20 refused attempts a minute per token get an audit row (the rest are refused without one).
        api_terminal_write_denied:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Failed token authentications (App\Security\Api\ApiAuthFailureThrottle), per client address.
        api_auth_failure:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    services:
        fleet.test.reveal_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
    framework:
        rate_limiter:
            upgrade_check:
                storage_service: fleet.test.reveal_storage
            reauth:
                storage_service: fleet.test.reveal_storage
            secret_reveal:
                # In memory and without a reset between requests, so a test sees its own reveals and no other test's.
                storage_service: fleet.test.reveal_storage
            api_read:
                storage_service: fleet.test.reveal_storage
            api_write:
                storage_service: fleet.test.reveal_storage
            api_terminal_read:
                storage_service: fleet.test.reveal_storage
            api_terminal_write:
                storage_service: fleet.test.reveal_storage
            api_terminal_write_burst:
                storage_service: fleet.test.reveal_storage
            api_terminal_write_instance:
                storage_service: fleet.test.reveal_storage
            api_terminal_write_denied:
                storage_service: fleet.test.reveal_storage
            api_auth_failure:
                storage_service: fleet.test.reveal_storage
