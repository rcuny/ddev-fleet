---
- name: Provision ddev-fleet host
  hosts: localhost
  become: true
  # Flush queued handlers even if a later role fails. Without this, a task
  # failing after the caddy role (which notifies "Reload caddy" on a changed
  # Caddyfile) leaves caddy running its default package config — the deployed
  # Caddyfile is on disk but never loaded, so :443 never comes up. Seen live
  # on the first Debian 13 rollout when an unrelated later role failed.
  force_handlers: true
  pre_tasks:
    # Host-local variable overrides live OUTSIDE /opt/ddev-fleet, so a code
    # re-delivery (rsync/tar of a clean checkout) never reverts them. Use
    # this for any secret that shouldn't sit in the committed group_vars
    # (e.g. fleet_repo_url with embedded credentials): set the real value in
    # /etc/ddev-fleet/local-vars.yml on the host, and it overrides the
    # committed default. include_vars (precedence #18) outranks
    # group_vars/all (#4), so the file's values win. NOTE: the dashboard
    # admin password is NOT one of these anymore — it's fleet-owned and
    # rotated via `fleet rotate-admin-password` / `fleet set-admin-password`
    # (fleet.core.caddyauth), never via group_vars or this override file.
    - name: Check for host-local variable overrides
      ansible.builtin.stat:
        path: /etc/ddev-fleet/local-vars.yml
      register: _fleet_local_vars
    - name: Load host-local variable overrides if present
      ansible.builtin.include_vars: /etc/ddev-fleet/local-vars.yml
      when: _fleet_local_vars.stat.exists
  roles:
    - base
    - docker
    - fleet_user
    - shell_profile
    - ddev
    - claude_cli
    - caddy
    - fleet_service
    # authelia MUST come after fleet_service: its tasks shell out to
    # {{ fleet_opt_dir }}/venv/bin/fleet (set-admin-password, refresh-auth),
    # which fleet_service is what installs on a fresh host — placed earlier
    # (immediately after caddy, as this plan's brief originally specified)
    # it would fail on first provisioning with the venv not yet existing.
    - authelia             # no-op unless fleet_auth_mode == 'authelia'
    - network_hardening   # no-op unless fleet_network_hardening_enabled
    - security_hardening  # no-op unless fleet_security_hardening_enabled
