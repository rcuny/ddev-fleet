---
# Scoped playbook: the Caddy role only (apt package, snippet directories,
# admin-auth seed, the rendered Caddyfile + tls.conf).
#
# Use this instead of site.yml to (re)apply Caddy config to a live host —
# e.g. switching fleet_tls_mode (on_demand <-> ovh_dns) or fleet_domain
# without touching anything else. site.yml's fleet_service role rewrites
# /opt/ddev-fleet's git remote to https, which breaks the SSH-key
# `git pull` the whole rollout flow depends on — so it must never be run
# against the live server. This playbook touches only the `caddy` role.
#
# It must live beside site.yml: group_vars/ resolves relative to the
# playbook's directory, so a copy in /tmp silently runs with fleet_domain
# undefined.
#
#   cd /opt/ddev-fleet/ansible
#   sudo ansible-playbook caddy-only.yml --check --diff   # preview
#   sudo ansible-playbook caddy-only.yml
#
# Switching to ovh_dns mode: edit /etc/ddev-fleet/local-vars.yml
# (fleet_tls_mode: "ovh_dns"), create /etc/caddy/ovh.env (0600 root:root,
# OVH_ENDPOINT/OVH_APPLICATION_KEY/OVH_APPLICATION_SECRET/OVH_CONSUMER_KEY),
# then run this playbook — see docs/installation.md.
#
# pre_tasks mirror site.yml/ddev-only.yml so /etc/ddev-fleet/local-vars.yml
# still overrides the committed group_vars.
- name: Apply Caddy configuration (package, snippet dirs, Caddyfile, TLS mode)
  hosts: localhost
  become: true
  force_handlers: true
  pre_tasks:
    - name: Check for host-local variable overrides
      ansible.builtin.stat:
        path: /etc/ddev-fleet/local-vars.yml
      register: _fleet_local_vars
    - name: Load host-local variable overrides if present
      ansible.builtin.include_vars: /etc/ddev-fleet/local-vars.yml
      when: _fleet_local_vars.stat.exists
  roles:
    - caddy
