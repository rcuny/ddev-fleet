---
- name: Create the fleet system user
  ansible.builtin.user:
    name: "{{ fleet_user }}"
    home: "{{ fleet_home_dir }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true

- name: Create the /srv/fleet directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0750"
  loop:
    - "{{ fleet_srv_dir }}"
    - "{{ fleet_srv_dir }}/assets"
    - "{{ fleet_srv_dir }}/instances"
    - "{{ fleet_srv_dir }}/locks"
    - "{{ fleet_srv_dir }}/config"

- name: Ensure .secrets exists with correct permissions (never overwrite content)
  ansible.builtin.file:
    path: "{{ fleet_srv_dir }}/.secrets"
    state: touch
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Seed fleet.yml if it does not already exist (never clobber a real registry)
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/fleet.yml"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0640"
    force: false
    content: |
      fleet:
        domain: {{ fleet_domain }}
        assets_path: {{ fleet_srv_dir }}/assets
        instances_path: {{ fleet_srv_dir }}/instances

      projects: {}

- name: Ensure /home/fleet/.ssh exists
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.ssh"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Ensure /home/fleet/.claude exists (spec §2 filesystem table)
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.claude"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Generate the fleet deploy SSH key (never regenerate an existing key)
  community.crypto.openssh_keypair:
    path: "{{ fleet_home_dir }}/.ssh/id_ed25519"
    type: ed25519
    force: false
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"

- name: Read the generated public key
  ansible.builtin.slurp:
    src: "{{ fleet_home_dir }}/.ssh/id_ed25519.pub"
  register: fleet_user_pubkey_raw

- name: Copy the public key to /srv/fleet/fleet-deploy-key.pub
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/fleet-deploy-key.pub"
    content: "{{ fleet_user_pubkey_raw.content | b64decode }}"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0644"

- name: Ensure /srv/fleet/.push-key exists
  ansible.builtin.file:
    path: "{{ fleet_srv_dir }}/.push-key"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Generate the fleet push SSH key (never regenerate an existing key)
  # Kept OUT of {{ fleet_home_dir }}/.ssh on purpose: a read-write PUSH key
  # must never be picked up by ssh's default identity search (which would
  # let it shadow the read-only deploy key generated above). It is only
  # ever used explicitly, via GIT_SSH_COMMAND/core.sshCommand -i pointing
  # at this exact path.
  community.crypto.openssh_keypair:
    path: "{{ fleet_srv_dir }}/.push-key/id_ed25519"
    type: ed25519
    force: false
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"

- name: Read the generated push public key
  ansible.builtin.slurp:
    src: "{{ fleet_srv_dir }}/.push-key/id_ed25519.pub"
  register: fleet_user_push_pubkey_raw

- name: Copy the push public key to /srv/fleet/fleet-push-key.pub
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/fleet-push-key.pub"
    content: "{{ fleet_user_push_pubkey_raw.content | b64decode }}"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0644"

- name: Print the fleet push public key
  ansible.builtin.debug:
    msg: >-
      Fleet PUSH key — register as a READ-WRITE access key on every project
      repo Claude will push to (oak, another-drupal-site, …):
      {{ fleet_user_push_pubkey_raw.content | b64decode }}

- name: Check which forge host keys are already in known_hosts
  # First half of the TOFU pair below: probe before we ever call ssh-keyscan,
  # so an already-seeded host never triggers a re-scan or a network call.
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -F
      - "{{ item }}"
      - -f
      - "{{ fleet_home_dir }}/.ssh/known_hosts"
  loop:
    - bitbucket.org
    - github.com
  register: fleet_user_known_hosts_check
  changed_when: false
  failed_when: false

- name: Seed known_hosts for git forges (first run per host only — TOFU)
  # TOFU caveat: ssh-keyscan trusts whatever host key each forge presents at
  # provisioning time — standard practice for CI/deploy hosts, but NOT
  # equivalent to out-of-band host-key verification. Accepted for v1
  # (spec §3.5). This task only runs when the check above found no existing
  # entry (rc != 0), so it seeds once on first provisioning and never
  # re-scans afterwards — a forge rotating its host key now requires
  # deliberate operator action (delete the known_hosts entry and re-run),
  # not silent re-acceptance on every playbook run.
  ansible.builtin.known_hosts:
    path: "{{ fleet_home_dir }}/.ssh/known_hosts"
    name: "{{ item.item }}"
    key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -t ed25519 -T 10 ' ~ item.item) }}"
    state: present
  loop: "{{ fleet_user_known_hosts_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: Fix ownership of the fleet SSH directory
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.ssh"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"
    recurse: true

- name: Print the fleet deploy public key
  ansible.builtin.debug:
    msg: >-
      Fleet deploy public key (add as a READ-ONLY deploy key on every forge
      hosting a registered project): {{ fleet_user_pubkey_raw.content | b64decode }}
