---
- name: Create the fleet system user
  ansible.builtin.user:
    name: "{{ fleet_user }}"
    home: "{{ fleet_home_dir }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true

- name: Create the /srv/fleet directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0750"
  loop:
    - "{{ fleet_srv_dir }}"
    - "{{ fleet_srv_dir }}/assets"
    - "{{ fleet_srv_dir }}/instances"
    - "{{ fleet_srv_dir }}/locks"
    - "{{ fleet_srv_dir }}/config"

- name: Ensure .secrets exists with correct permissions (never overwrite content)
  ansible.builtin.file:
    path: "{{ fleet_srv_dir }}/.secrets"
    state: touch
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve

# Bundled demo project: turn the repo's demo/ source into a local bare git repo
# so `fleet deploy demo` works on a fresh install with no private config repo and
# no network. Staged from the playbook checkout; the bare repo is built once
# (creates: guard) — to refresh it after editing demo/, remove _demo.git first.
- name: Stage the bundled demo project source on the host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../demo/"
    dest: "{{ fleet_srv_dir }}/_demo-src/"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0644"
    directory_mode: "0755"

- name: Build the local demo bare repo from the staged source (first provision only)
  become: true
  become_user: "{{ fleet_user }}"
  ansible.builtin.shell:
    # cmd: (block-scalar), not free-form — a free-form multi-line string here
    # defeats ansible's split_args (unbalanced-quote/jinja2 parse error) once
    # it contains both {{ }} templating and embedded quotes. This form is
    # parsed as a single literal string, sidestepping that entirely.
    cmd: |
      set -euo pipefail
      work="$(mktemp -d)"
      cp -a "{{ fleet_srv_dir }}/_demo-src/." "$work/"
      git -C "$work" init -q -b main
      git -C "$work" -c user.name='ddev-fleet' -c user.email='fleet@localhost' add -A
      git -C "$work" -c user.name='ddev-fleet' -c user.email='fleet@localhost' commit -q -m 'ddev-fleet demo'
      # -b main so the bare repo's HEAD matches the pushed branch (a plain clone
      # would otherwise fail to check out — default bare HEAD is refs/heads/master).
      git init -q --bare -b main "{{ fleet_srv_dir }}/_demo.git"
      git -C "$work" push -q "{{ fleet_srv_dir }}/_demo.git" main
      rm -rf "$work"
    creates: "{{ fleet_srv_dir }}/_demo.git/HEAD"

- name: Seed config/fleet.yml if it does not already exist (never clobber a real registry)
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/config/fleet.yml"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0640"
    force: false
    content: |
      # Seeded by ddev-fleet on first provision. Replace with your own registry
      # (e.g. a private config repo checked out at {{ fleet_srv_dir }}/config) —
      # this file is never overwritten once it exists. The `demo` project below
      # deploys the bundled demo (file://{{ fleet_srv_dir }}/_demo.git) so
      # `fleet deploy demo` works out of the box; remove it once you have real
      # projects.
      fleet:
        domain: {{ fleet_domain }}

      projects:
        demo:
          git: file://{{ fleet_srv_dir }}/_demo.git
          default_branch: main
          default_template: default
          templates:
            default:
              post_deploy: [ddev start]

- name: Ensure /home/fleet/.ssh exists
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.ssh"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Ensure /home/fleet/.claude exists (spec §2 filesystem table)
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.claude"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Generate the fleet deploy SSH key (never regenerate an existing key)
  community.crypto.openssh_keypair:
    path: "{{ fleet_home_dir }}/.ssh/id_ed25519"
    type: ed25519
    force: false
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"

- name: Read the generated public key
  ansible.builtin.slurp:
    src: "{{ fleet_home_dir }}/.ssh/id_ed25519.pub"
  register: fleet_user_pubkey_raw

- name: Copy the public key to /srv/fleet/fleet-deploy-key.pub
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/fleet-deploy-key.pub"
    content: "{{ fleet_user_pubkey_raw.content | b64decode }}"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0644"

- name: Ensure /srv/fleet/.push-key exists
  ansible.builtin.file:
    path: "{{ fleet_srv_dir }}/.push-key"
    state: directory
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"

- name: Generate the fleet push SSH key (never regenerate an existing key)
  # Kept OUT of {{ fleet_home_dir }}/.ssh on purpose: a read-write PUSH key
  # must never be picked up by ssh's default identity search (which would
  # let it shadow the read-only deploy key generated above). It is only
  # ever used explicitly, via GIT_SSH_COMMAND/core.sshCommand -i pointing
  # at this exact path.
  community.crypto.openssh_keypair:
    path: "{{ fleet_srv_dir }}/.push-key/id_ed25519"
    type: ed25519
    force: false
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0600"

- name: Read the generated push public key
  ansible.builtin.slurp:
    src: "{{ fleet_srv_dir }}/.push-key/id_ed25519.pub"
  register: fleet_user_push_pubkey_raw

- name: Copy the push public key to /srv/fleet/fleet-push-key.pub
  ansible.builtin.copy:
    dest: "{{ fleet_srv_dir }}/fleet-push-key.pub"
    content: "{{ fleet_user_push_pubkey_raw.content | b64decode }}"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0644"

- name: Print the fleet push public key
  ansible.builtin.debug:
    msg: >-
      Fleet PUSH key — register as a READ-WRITE access key on every project
      repo Claude will push to (oak, another-drupal-site, …):
      {{ fleet_user_push_pubkey_raw.content | b64decode }}

- name: Check which forge host keys are already in known_hosts
  # First half of the TOFU pair below: probe before we ever call ssh-keyscan,
  # so an already-seeded host never triggers a re-scan or a network call.
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -F
      - "{{ item }}"
      - -f
      - "{{ fleet_home_dir }}/.ssh/known_hosts"
  loop:
    - bitbucket.org
    - github.com
  register: fleet_user_known_hosts_check
  changed_when: false
  failed_when: false

- name: Seed known_hosts for git forges (first run per host only — TOFU)
  # TOFU caveat: ssh-keyscan trusts whatever host key each forge presents at
  # provisioning time — standard practice for CI/deploy hosts, but NOT
  # equivalent to out-of-band host-key verification. Accepted for v1
  # (spec §3.5). This task only runs when the check above found no existing
  # entry (rc != 0), so it seeds once on first provisioning and never
  # re-scans afterwards — a forge rotating its host key now requires
  # deliberate operator action (delete the known_hosts entry and re-run),
  # not silent re-acceptance on every playbook run.
  ansible.builtin.known_hosts:
    path: "{{ fleet_home_dir }}/.ssh/known_hosts"
    name: "{{ item.item }}"
    key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -t ed25519 -T 10 ' ~ item.item) }}"
    state: present
  loop: "{{ fleet_user_known_hosts_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: Fix ownership of the fleet SSH directory
  ansible.builtin.file:
    path: "{{ fleet_home_dir }}/.ssh"
    owner: "{{ fleet_user }}"
    group: "{{ fleet_group }}"
    mode: "0700"
    recurse: true

- name: Print the fleet deploy public key
  ansible.builtin.debug:
    msg: >-
      Fleet deploy public key (add as a READ-ONLY deploy key on every forge
      hosting a registered project): {{ fleet_user_pubkey_raw.content | b64decode }}
