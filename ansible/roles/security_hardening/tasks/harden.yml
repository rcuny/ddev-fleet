---
- name: Install unattended-upgrades, needrestart, apt-listchanges
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - needrestart
      - apt-listchanges
    state: present

- name: Deploy the fleet unattended-upgrades hardening drop-in
  ansible.builtin.template:
    src: 51fleet-hardening.conf.j2
    dest: /etc/apt/apt.conf.d/51fleet-hardening
    owner: root
    group: root
    mode: "0644"

- name: Deploy the needrestart non-interactive trap
  ansible.builtin.copy:
    src: 50fleet-autorestart.conf
    dest: /etc/needrestart/conf.d/50fleet-autorestart.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy the fleet-owned Docker daemon.json (live-restore + log rotation)
  # Fully fleet-owned (copy semantics via template, not a merge) —
  # confirmed no other role in this codebase writes this file (spec §13).
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Deploy the SSH hardening drop-in
  # Validated against Ansible's staged temp copy via `validate:` (sshd -t -f
  # %s) BEFORE the file is moved into place — not via a separate `sshd -t`
  # task after the template task, because site.yml sets
  # `force_handlers: true` play-wide, which would fire the already-notified
  # "Reload sshd" handler even if a later syntax-check task failed (spec
  # §6.2 task 5 / deviation note). `validate:` rejects a bad drop-in before
  # it ever reaches /etc/ssh/sshd_config.d/, so the handler is never
  # notified for an invalid config, independent of force_handlers.
  ansible.builtin.template:
    src: 52fleet-sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Reload sshd
