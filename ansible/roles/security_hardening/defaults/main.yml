---
fleet_security_hardening_enabled: false
fleet_unattended_upgrades_origins:
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
# Default to the REAL operator, not ansible_user_id. The installer runs
# `ansible-playbook -c local` under `sudo`, so ansible_user_id is `root` —
# defaulting to it would emit `AllowUsers root` and lock out the actual SSH
# operator (e.g. `debian` on this project's own production server), who can
# only be recovered via console access. ansible_env.SUDO_USER is the user
# who invoked sudo; fall back to ansible_user_id when not run via sudo
# (e.g. logged in directly as root), and drop an empty result defensively.
fleet_ssh_allow_users: "{{ [ansible_env.SUDO_USER | default(ansible_user_id, true)] | select | list }}"
fleet_ssh_max_auth_tries: 3
fleet_fail2ban_enabled: true
fleet_docker_log_max_size: "10m"
fleet_docker_log_max_file: "3"
fleet_tmp_hardening_enabled: true
fleet_auditd_enabled: true
fleet_reboot_notify_enabled: true
fleet_reboot_notify_interval_hours: 24
fleet_msmtp_host: ""
fleet_msmtp_port: 587
fleet_msmtp_tls: true
fleet_msmtp_from: ""
fleet_msmtp_to: ""

# --- systemd security check (FLE-1) ------------------------------------------
# At the end of harden.yml, score each installed unit below with
# `systemd-analyze security` (0 = locked down ... 10 = no sandbox) and print a
# summary, so a sandbox drop-in that silently stopped applying (renamed vendor
# unit, typo, fleet_systemd_sandbox_enabled: false) shows up at provisioning
# time. Units that are not installed (e.g. authelia in basic auth mode) are
# skipped.
fleet_systemd_security_check_enabled: true
# Per-unit maximum acceptable exposure on systemd's 0-100 threshold scale
# (25 = 2.5 on the 0-10 scale `systemd-analyze security` prints).
fleet_systemd_security_thresholds:
  fleet.service: 25
  fleet-boot.service: 25
  fleet-reboot-notify.service: 25
  caddy.service: 25
  authelia.service: 35
# false (default): a unit over its threshold only logs a WARNING.
# true: it fails the play.
fleet_systemd_security_enforce: false
