---
- name: Reload docker
  # NEVER restart docker from this role: a restart stops every container, and
  # DDEV containers have restart policy `no`, so on a live host that does not
  # run with live-restore yet every instance would stay down. docker.service's
  # ExecReload sends SIGHUP; `live-restore` is a reloadable daemon option and
  # the log-driver options only affect containers created afterwards, so a
  # reload applies everything daemon.json carries without touching containers.
  ansible.builtin.systemd:
    name: docker
    state: reloaded

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: false

- name: Reload systemd daemon (security_hardening)
  ansible.builtin.systemd:
    daemon_reload: true
