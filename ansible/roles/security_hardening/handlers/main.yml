---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: false

- name: Reload systemd daemon (security_hardening)
  ansible.builtin.systemd:
    daemon_reload: true
