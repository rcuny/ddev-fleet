# Managed by the security_hardening Ansible role (spec §6.2 task 7).
# Deliberately conservative — does NOT set net.ipv4.ip_forward=0 (Docker
# needs it) and does NOT tighten rp_filter (breaks routing across the
# fleet's multiple Docker bridges).
kernel.dmesg_restrict = 1
net.ipv4.conf.all.log_martians = 1
