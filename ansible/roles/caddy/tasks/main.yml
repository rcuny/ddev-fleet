---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Caddy apt signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/caddy.asc] {{ caddy_apt_repo }} any-version main"
    filename: caddy
    state: present
    update_cache: true

- name: Install the caddy package
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Ensure the fleet-owned Caddy credential snippet directory exists
  # setgid (the leading "2" in mode 2750): Caddy runs as User=caddy and
  # reads these snippets straight off disk on every `systemctl restart
  # caddy` (reboot, package upgrade, unattended-upgrades) — not just via
  # `caddy reload`'s admin API. But the snippets themselves are written by
  # the fleet user (core/caddyauth.py's _atomic_write, e.g. a rotated
  # admin-auth.conf), whose primary group is `fleet`, not `caddy`, and
  # `caddy` is not a member of the `fleet` group. Without setgid, a
  # fleet-written file would land group `fleet` and be unreadable by the
  # caddy user on a fresh `caddy run` — every site down. setgid on the
  # directory makes the kernel assign new files the directory's group
  # (caddy) regardless of the writing process's own group, with no chown
  # needed on the Python side.
  ansible.builtin.file:
    path: "{{ fleet_caddy_snippet_dir }}"
    state: directory
    owner: "{{ fleet_user }}"
    group: caddy
    mode: "2750"

- name: Ensure the fleet-owned per-instance Caddy auth snippet directory exists
  # Per-instance basic-auth snippets (fleet.core.caddyauth, written/removed
  # at deploy/destroy time — never by Ansible) live here. Pre-creating it
  # with the same ownership as the parent snippet dir means the
  # *.{{ fleet_domain }} site's glob import (Caddyfile.j2) never depends on
  # Python-side mkdir() guessing at group ownership when a fresh instance
  # is the very first to enable auth.
  #
  # setgid (mode 2750, see the parent-dir task above for the full why):
  # every snippet the fleet user writes here (mkstemp + rename) inherits
  # this directory's `caddy` group automatically, so `caddy`, which is not
  # in the `fleet` group, can still read it on a plain `systemctl restart
  # caddy` (not just a fleet-triggered `caddy reload`).
  ansible.builtin.file:
    path: "{{ fleet_caddy_snippet_dir }}/instances"
    state: directory
    owner: "{{ fleet_user }}"
    group: caddy
    mode: "2750"

- name: Ensure the fleet-owned Caddy named-port snippet directory exists
  # Per-port-name exposure snippets (fleet.core.caddyports, written/removed
  # by deploy()/destroy()/`fleet refresh-ports`/daemon startup — never by
  # Ansible past this one-time seed) live here. Pre-creating it with the
  # same ownership as the parent snippet dir means the *.{{ fleet_domain }}
  # Caddyfile's glob import (Caddyfile.j2) never depends on Python-side
  # mkdir() guessing at group ownership when the first port is subscribed.
  #
  # setgid (mode 2750, see the parent-dir task above for the full why):
  # same fleet-writes/caddy-reads mismatch as the instances/ dir above.
  ansible.builtin.file:
    path: "{{ fleet_caddy_snippet_dir }}/ports"
    state: directory
    owner: "{{ fleet_user }}"
    group: caddy
    mode: "2750"

- name: Fix the group of any pre-existing snippets from before the setgid fix
  # setgid only affects files created AFTER the directory gets the setgid
  # bit — a box provisioned before this change can already have
  # fleet:fleet snippets on disk (written by core/caddyauth.py /
  # core/caddyports.py before the dirs above were setgid). Recursively
  # re-group any such stragglers to `caddy` so a re-run of this role also
  # repairs an already-broken box. Idempotent: ansible.builtin.file only
  # reports changed for entries whose group actually differs, so this is
  # changed=0 once every snippet is already `caddy`-owned. Deliberately
  # omits `mode:` so existing file permissions (0640 — group-readable) are
  # left untouched; only ownership metadata (group) is touched.
  ansible.builtin.file:
    path: "{{ fleet_caddy_snippet_dir }}/{{ item }}"
    state: directory
    recurse: true
    group: caddy
  loop:
    - instances
    - ports

- name: Check whether the admin-auth snippet already exists
  # Guards the seed below — this MUST run before we ever hash the default
  # password or write the snippet, so a re-run of this role never clobbers
  # a password rotated out-of-band by `fleet set-admin-password` /
  # `fleet rotate-admin-password` (fleet.core.caddyauth).
  ansible.builtin.stat:
    path: "{{ fleet_caddy_snippet_dir }}/admin-auth.conf"
  register: caddy_admin_auth_snippet_stat

- name: Fix the group of a pre-existing admin-auth snippet from before the setgid fix
  # Same latent bug as the instances/ports snippets above: admin-auth.conf
  # is rewritten in place by core/caddyauth.py on every
  # `fleet rotate-admin-password` / `fleet set-admin-password`, as the
  # fleet user, via the same fleet:fleet-by-default mkstemp path. On a box
  # provisioned (or rotated) before the parent dir got setgid, the file can
  # already sit at group `fleet`, unreadable by caddy on a plain
  # `systemctl restart caddy`. Only runs when the snippet already exists
  # (the seed task below only ever WRITES a fresh one; it never re-groups
  # an existing one). Idempotent: changed=0 once the group is already
  # `caddy`. Mode is deliberately left untouched (stays 0640,
  # group-readable).
  ansible.builtin.file:
    path: "{{ fleet_caddy_snippet_dir }}/admin-auth.conf"
    state: file
    group: caddy
  when: caddy_admin_auth_snippet_stat.stat.exists

- name: Fail fast if no admin password is configured (no public-safe default)
  # Catches BOTH the undefined case and an empty string
  # (-e fleet_admin_default_password="") — the latter previously slipped
  # through this guard and went on to hash an empty password.
  ansible.builtin.fail:
    msg: >-
      fleet_admin_default_password is not set. There is no public-safe
      default for the dashboard admin password — bootstrap.sh's
      value-collection phase generates or prompts for one and writes it to
      /etc/ddev-fleet/local-vars.yml (see docs/installation.md). For a
      manual/dev run, pass -e fleet_admin_default_password=<value>.
  when:
    - not caddy_admin_auth_snippet_stat.stat.exists
    - fleet_admin_default_password is not defined or fleet_admin_default_password | default('') | length == 0

- name: Hash the distribution-default admin password (first provisioning only)
  ansible.builtin.command:
    argv:
      - caddy
      - hash-password
      - --plaintext
      - "{{ fleet_admin_default_password }}"
  register: caddy_admin_default_hash
  changed_when: false
  when: not caddy_admin_auth_snippet_stat.stat.exists

- name: Seed the admin-auth snippet with the default credentials
  # Only runs when the file did not already exist (see the stat task above)
  # — never overwrites a rotated password. The snippet is non-empty (Caddy
  # only warns, never errors, on an empty *existing* file — but a real,
  # working default is what "seed" means here and what README.md documents
  # as the distribution default).
  ansible.builtin.copy:
    dest: "{{ fleet_caddy_snippet_dir }}/admin-auth.conf"
    owner: "{{ fleet_user }}"
    group: caddy
    mode: "0640"
    content: "{{ fleet_admin_user }} {{ caddy_admin_default_hash.stdout }}\n"
  when: not caddy_admin_auth_snippet_stat.stat.exists

- name: Remove the now-unnecessary fleet-caddy-reload sudoers grant
  # Superseded: fleet.core.caddyauth.reload_caddy() now reloads via
  # `caddy reload` (talks to the local Caddy admin API on 127.0.0.1:2019,
  # unauthenticated by default), which needs no privilege escalation at
  # all — so this sudoers rule is no longer required. Actively remove it
  # (not just stop installing it) so already-provisioned hosts have the
  # stale privilege grant cleaned up on the next site.yml run.
  ansible.builtin.file:
    path: /etc/sudoers.d/fleet-caddy-reload
    state: absent

- name: Fail fast if fleet_tls_mode is not a recognised value
  # No public-safe "just guess" behaviour here — an unrecognised mode means
  # tls.conf.j2 below would render nothing useful, so refuse before that.
  ansible.builtin.assert:
    that:
      - fleet_tls_mode in ['on_demand', 'ovh_dns']
    fail_msg: >-
      fleet_tls_mode='{{ fleet_tls_mode }}' is not recognised. Allowed
      values: 'on_demand' (default — per-hostname Let's Encrypt via HTTP-01,
      no setup) or 'ovh_dns' (wildcard cert via the OVH DNS-01 challenge,
      needs /etc/caddy/ovh.env). See ansible/group_vars/all.yml and
      docs/installation.md.
    success_msg: "fleet_tls_mode='{{ fleet_tls_mode }}' is valid"

# --- ovh_dns mode: OVH API credentials -------------------------------------
# Ansible NEVER writes /etc/caddy/ovh.env's CONTENTS (spec decision 5) — an
# operator creates it (bootstrap.sh's TLS-mode prompt, or by hand). This
# role only asserts it exists with all four required keys, fixes its
# owner/group/mode, and wires it into caddy.service via a systemd drop-in.
- name: OVH DNS credentials (ovh_dns mode only)
  when: fleet_tls_mode == 'ovh_dns'
  block:
    - name: Check whether the OVH credentials file exists
      ansible.builtin.stat:
        path: "{{ fleet_ovh_env_file }}"
      register: fleet_ovh_env_stat

    - name: Fail fast if the OVH credentials file is missing
      ansible.builtin.fail:
        msg: >-
          fleet_tls_mode is 'ovh_dns' but {{ fleet_ovh_env_file }} does not
          exist. Ansible never writes this file's contents (it holds OVH API
          secrets) — create it first: bootstrap.sh's TLS-mode prompt does
          this interactively, or write it by hand (0600 root:root) with
          OVH_ENDPOINT, OVH_APPLICATION_KEY, OVH_APPLICATION_SECRET,
          OVH_CONSUMER_KEY — see docs/installation.md.
      when: not fleet_ovh_env_stat.stat.exists

    - name: Read the OVH credentials file to check for required keys
      # no_log: the file's raw content includes secret VALUES, not just key
      # names — must never land in Ansible output/logs.
      ansible.builtin.slurp:
        src: "{{ fleet_ovh_env_file }}"
      register: fleet_ovh_env_content
      no_log: true

    - name: Determine which required OVH keys are present (key NAMES only, never values)
      ansible.builtin.set_fact:
        fleet_ovh_env_missing_keys: >-
          {{ ['OVH_ENDPOINT', 'OVH_APPLICATION_KEY', 'OVH_APPLICATION_SECRET', 'OVH_CONSUMER_KEY']
          | difference((fleet_ovh_env_content.content | b64decode)
          | regex_findall('(?m)^[ \t]*([A-Z_]+)[ \t]*=[ \t]*[^\s]')) }}
      no_log: true

    - name: Fail fast if the OVH credentials file is missing a required key
      # The message names only key NAMES, never values — safe to print.
      ansible.builtin.fail:
        msg: >-
          {{ fleet_ovh_env_file }} is missing required key(s):
          {{ fleet_ovh_env_missing_keys | join(', ') }}. Not printing file
          contents. See docs/installation.md.
      when: fleet_ovh_env_missing_keys | length > 0

    - name: Fix ownership/permissions of the OVH credentials file
      # 0640 root:caddy — same read model as every other fleet-owned Caddy
      # secret: group-readable by caddy, never world-readable. Ansible runs
      # as root, so this is a plain chown/chmod, not the fleet-write/
      # setgid-inherit pattern the snippet dirs need.
      ansible.builtin.file:
        path: "{{ fleet_ovh_env_file }}"
        state: file
        owner: root
        group: caddy
        mode: "0640"

    - name: Ensure the caddy.service systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the caddy.service EnvironmentFile drop-in for OVH credentials
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/ovh-env.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile={{ fleet_ovh_env_file }}
      notify:
        - Reload systemd daemon
        - Restart caddy

# --- ovh_dns mode: custom caddy binary with the caddy-dns/ovh plugin ------
# Caddy's official method for a custom build alongside the apt package
# (https://caddyserver.com/docs/build#package-support-files-for-custom-builds-for-debianubunturaspbian):
# divert the apt-installed binary aside, download a custom build carrying
# the plugin, then register BOTH as `update-alternatives` choices for
# /usr/bin/caddy so a future `apt upgrade` of the caddy package keeps
# reinstalling to the diverted path (caddy.default) without clobbering the
# custom binary — `update-alternatives` (not a raw symlink) is what makes
# that survive package upgrades cleanly.
#
# In on_demand mode NONE of this runs — the package binary is used as-is,
# and any PRE-EXISTING divert/alternatives from a prior ovh_dns install is
# left untouched (switching a server back to on_demand only needs
# tls.conf.j2 to stop emitting the ovh directive; the custom binary is
# harmless to leave in place — see docs/installation.md "switching mode").
- name: Determine the caddy-dns/ovh download architecture from ansible_architecture
  ansible.builtin.set_fact:
    fleet_caddy_arch_map:
      x86_64: amd64
      amd64: amd64
      aarch64: arm64
      arm64: arm64
  when: fleet_tls_mode == 'ovh_dns'

- name: Resolve fleet_caddy_ovh_arch from the architecture map
  ansible.builtin.set_fact:
    fleet_caddy_ovh_arch: "{{ fleet_caddy_arch_map[ansible_architecture] | default(ansible_architecture) }}"
  when: fleet_tls_mode == 'ovh_dns'

- name: Check whether the currently active caddy binary already has the OVH DNS module
  # Idempotency gate for the whole divert+download+alternatives block below —
  # `caddy list-modules` lists `dns.providers.ovh` only once the custom
  # binary is the one `update-alternatives` currently selects.
  ansible.builtin.command: caddy list-modules
  register: fleet_caddy_modules
  changed_when: false
  failed_when: false
  when: fleet_tls_mode == 'ovh_dns'

- name: Build and install a caddy binary with the caddy-dns/ovh plugin (first ovh_dns provisioning only)
  when:
    - fleet_tls_mode == 'ovh_dns'
    - "'dns.providers.ovh' not in fleet_caddy_modules.stdout"
  block:
    - name: Check whether /usr/bin/caddy is already diverted aside
      ansible.builtin.command: dpkg-divert --list /usr/bin/caddy
      register: fleet_caddy_divert_list
      changed_when: false

    - name: Divert the apt-installed caddy binary to /usr/bin/caddy.default
      ansible.builtin.command: dpkg-divert --divert /usr/bin/caddy.default --rename /usr/bin/caddy
      when: fleet_caddy_divert_list.stdout == ""
      changed_when: true

    - name: Download the custom caddy build with the caddy-dns/ovh plugin
      ansible.builtin.get_url:
        url: "https://caddyserver.com/api/download?os=linux&arch={{ fleet_caddy_ovh_arch }}&p=github.com%2Fcaddy-dns%2Fovh"
        dest: /usr/bin/caddy.custom
        mode: "0755"
        owner: root
        group: root

    - name: Validate the downloaded custom caddy binary actually runs
      ansible.builtin.command: /usr/bin/caddy.custom version
      changed_when: false

    - name: Register both caddy binaries as update-alternatives choices for /usr/bin/caddy
      # Higher priority (50) wins automatically in auto mode, so /usr/bin/caddy
      # now resolves to caddy.custom without a manual `--set`.
      ansible.builtin.command: "update-alternatives --install /usr/bin/caddy caddy {{ item.path }} {{ item.priority }}"
      loop:
        - { path: /usr/bin/caddy.default, priority: 10 }
        - { path: /usr/bin/caddy.custom, priority: 50 }
      loop_control:
        label: "{{ item.path }}"
      changed_when: true
      notify: Restart caddy

- name: Render the shared TLS snippet (tls.conf, per fleet_tls_mode)
  # MUST run before "Deploy the Caddyfile" below — both the *.{{ fleet_domain
  # }} site and every fleet-owned named-port snippet (fleet.core.caddyports)
  # import this by a LITERAL path, which is a hard Caddy validate error if
  # missing.
  ansible.builtin.template:
    src: tls.conf.j2
    dest: "{{ fleet_caddy_snippet_dir }}/tls.conf"
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

- name: Deploy the Caddyfile (spec §9.3)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    # Validate with the SAME environment caddy.service gets from its
    # EnvironmentFile drop-in: tls.conf's `{$OVH_*}` placeholders are
    # substituted at Caddyfile parse time, so validating without them would
    # parse `endpoint` etc. with no argument and fail. No-op when the file
    # is absent (on_demand mode).
    validate: >-
      /bin/sh -c 'set -a; if [ -r {{ fleet_ovh_env_file }} ]; then . {{ fleet_ovh_env_file }}; fi;
      exec caddy validate --config "$1" --adapter caddyfile' sh %s
  notify: Reload caddy

- name: Ensure caddy.service is enabled and started
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
