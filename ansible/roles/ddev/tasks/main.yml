---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the DDEV apt signing key
  ansible.builtin.get_url:
    url: https://pkg.ddev.com/apt/gpg.key
    dest: /etc/apt/keyrings/ddev.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the DDEV apt repository
  ansible.builtin.apt_repository:
    # DDEV's flat apt repo: suite '*' AND component '*' (both required — a
    # one-line entry needs URI SUITE COMPONENT; omitting the component gives
    # apt "Malformed entry ... (Component)"). Matches DDEV's documented line.
    repo: "deb [signed-by=/etc/apt/keyrings/ddev.asc] {{ ddev_apt_repo }} * *"
    filename: ddev
    state: present
    update_cache: true

- name: Install the ddev package
  ansible.builtin.apt:
    name: ddev
    state: present

- name: Check whether a DDEV global config already exists
  ansible.builtin.stat:
    path: "{{ fleet_home_dir }}/.ddev/global_config.yaml"
  become: true
  become_user: "{{ fleet_user }}"
  register: ddev_global_config_file

- name: Read the current DDEV global config, if any
  ansible.builtin.slurp:
    src: "{{ fleet_home_dir }}/.ddev/global_config.yaml"
  become: true
  become_user: "{{ fleet_user }}"
  register: ddev_global_config_raw
  when: ddev_global_config_file.stat.exists

- name: Compute the current global config text (empty string if absent)
  ansible.builtin.set_fact:
    ddev_global_config_text: >-
      {{ (ddev_global_config_raw.content | b64decode)
         if ddev_global_config_file.stat.exists else '' }}

- name: Apply DDEV global router configuration (loopback-only, spec §9.2)
  # DDEV's router binds 127.0.0.1 by default (router_bind_all_interfaces:
  # false) — the runbook (Task 10) re-verifies this live, since it is
  # load-bearing for the Caddy/DDEV port split (spec §9). Idempotence is
  # pinned to the literal port lines already present in global_config.yaml
  # rather than trusting `ddev config global`'s own change reporting.
  ansible.builtin.command:
    cmd: >-
      ddev config global
      --router-http-port={{ ddev_router_http_port }}
      --router-https-port={{ ddev_router_https_port }}
      --instrumentation-opt-in=false
  become: true
  become_user: "{{ fleet_user }}"
  # become_user does NOT reset HOME — sudo leaves HOME=/root, so without
  # this override `ddev config global` would write to /root/.ddev instead
  # of {{ fleet_home_dir }}/.ddev, and the fleet.service daemon (User=fleet)
  # would then see DDEV's default router ports (80/443), colliding with
  # Caddy. The guard tasks above already read/write
  # {{ fleet_home_dir }}/.ddev/global_config.yaml, so this keeps them
  # pointed at the same file the daemon actually uses.
  environment:
    HOME: "{{ fleet_home_dir }}"
  changed_when: true
  when: >-
    ('router_http_port: ' + (ddev_router_http_port | string)) not in ddev_global_config_text
    or ('router_https_port: ' + (ddev_router_https_port | string)) not in ddev_global_config_text

- name: Check whether the fleet user's mkcert local CA already exists and is readable
  # mkcert's default CAROOT on Linux is $HOME/.local/share/mkcert; the file DDEV
  # looks for is rootCA.pem there. We stat it AS the fleet user so `readable`
  # reflects the fleet user's own access — catching both the "absent" and the
  # "present but root-owned/unreadable" cases (the latter is the sudo-HOME=/root
  # footgun noted below), either of which triggers (re)install.
  ansible.builtin.stat:
    path: "{{ fleet_home_dir }}/.local/share/mkcert/rootCA.pem"
  become: true
  become_user: "{{ fleet_user }}"
  register: ddev_mkcert_ca

- name: Install the mkcert local CA for the fleet user (silences DDEV's per-start warning)
  # DDEV checks `mkcert -CAROOT` on every `ddev start`/`restart` and warns when
  # the fleet user has no locally-trusted CA. That warning is cosmetic in this
  # architecture — Caddy terminates public Let's Encrypt TLS and reverse-proxies
  # to DDEV's *HTTP* router port (roles/caddy/templates/Caddyfile.j2), so DDEV's
  # mkcert-signed HTTPS router cert (port 8443) is never presented to a client —
  # but we create the CA anyway to keep instance start/restart output clean.
  ansible.builtin.command:
    cmd: mkcert -install
  become: true
  become_user: "{{ fleet_user }}"
  environment:
    # HOME override for the same reason as the router-config task above: sudo
    # leaves HOME=/root, so without this mkcert writes its CAROOT under
    # /root/.local/share and the fleet-run `ddev` would still find none.
    HOME: "{{ fleet_home_dir }}"
    # Restrict mkcert to the NSS/Firefox trust store (absent on this headless
    # host, so silently skipped). This deliberately EXCLUDES the "system" store:
    # that path shells out to `sudo` to write /usr/local/share/ca-certificates,
    # which would hang or fail for the unprivileged fleet user. mkcert still
    # creates the CAROOT files first regardless of the store list — and the CA
    # does not need to be system-trusted here (nothing verifies DDEV's cert).
    TRUST_STORES: nss
  register: ddev_mkcert_install
  changed_when: ddev_mkcert_install.rc == 0
  when: not (ddev_mkcert_ca.stat.exists and ddev_mkcert_ca.stat.readable)
