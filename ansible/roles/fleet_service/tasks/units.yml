---
# The systemd units + CLI wrapper of the fleet_service role (no git, no pip).
# Imported by main.yml at the position the tasks always had, and run on its own
# by ansible/fleet-units.yml (import_role ... tasks_from: units.yml) so a live
# host can refresh the units without the clone/venv/pip tasks.

- name: Deploy the fleet.service systemd unit (spec §3.4)
  ansible.builtin.template:
    src: fleet.service.j2
    dest: /etc/systemd/system/fleet.service
    owner: root
    group: root
    mode: "0644"
  # A changed unit (e.g. the FLE-1 sandbox) only takes effect on a restart.
  # Both handlers run in this order at the end of the play: daemon-reload,
  # then try-restart (restarts fleet.service only if it is running, so a
  # fresh bootstrap that has not started the daemon yet is not started early).
  notify:
    - Reload systemd daemon
    - Restart fleet.service if running

- name: Ensure fleet.service is enabled
  # Not started here: the companion dev container has no systemd (PID 1)
  # to manage services, so `state: started` fails on every in-container
  # run. On the real host the runbook (Task 10, step 7) explicitly starts
  # it after the spec §16 verification items pass.
  ansible.builtin.systemd:
    name: fleet.service
    enabled: true
    daemon_reload: true

- name: Install the fleet CLI wrapper on PATH
  # `fleet …` for host operators: execs the venv CLI as the fleet user so
  # commands (e.g. `fleet secret set`) always run under the identity that owns
  # /srv/fleet. See the script header for usage.
  ansible.builtin.template:
    src: fleet.j2
    dest: /usr/local/bin/fleet
    owner: root
    group: root
    mode: "0755"

- name: Deploy the fleet-boot.service systemd unit (boot-time sequential instance start)
  # Runs `fleet start --all --sequential` once at boot so existing DDEV
  # instances come back up after a server reboot without manual
  # intervention — they do not auto-start on their own. Tagged separately
  # so this (and the enable task below) can be applied without the
  # git-remote-rewriting clone/pip tasks in main.yml (see ddev-fleet/CLAUDE.md's
  # "do NOT run the full site.yml casually" caveat).
  ansible.builtin.template:
    src: fleet-boot.service.j2
    dest: /etc/systemd/system/fleet-boot.service
    owner: root
    group: root
    mode: "0644"
  tags: [fleet_boot]
  notify: Reload systemd daemon

- name: Enable fleet-boot.service at boot (not started now — it is boot-only)
  # Not started here: the companion dev container has no systemd (PID 1),
  # and even on the real host this unit is meant to fire only at boot, not
  # on every ansible run.
  ansible.builtin.systemd:
    name: fleet-boot.service
    enabled: true
    daemon_reload: true
  tags: [fleet_boot]

- name: Deploy the fleet-tmux.service systemd unit (owns the `fleet` tmux session, FLE-6)
  # Owns the tmux server of the `fleet` session in its OWN cgroup so
  # `systemctl restart fleet` never kills operators' panes, and recreates the
  # session (plain shells, no tty commands) after a reboot. Tagged separately
  # like fleet_boot so it can be applied without the git-remote-rewriting
  # clone/pip tasks in main.yml (see ddev-fleet/CLAUDE.md's "do NOT run the full
  # site.yml casually" caveat).
  ansible.builtin.template:
    src: fleet-tmux.service.j2
    dest: /etc/systemd/system/fleet-tmux.service
    owner: root
    group: root
    mode: "0644"
  tags: [fleet_tmux]
  notify: Reload systemd daemon

- name: Enable and start fleet-tmux.service
  # Unlike fleet-boot (boot-only), this one is started now too, so the session
  # exists without waiting for a reboot. `state: started` is idempotent and
  # deliberately NOT `restarted`: stopping the unit (ExecStop) ends the `fleet`
  # session and every pane in it, so a changed unit file must be picked up by
  # the operator at a moment of their choosing, never by an Ansible run. If an
  # operator-created `fleet` session already exists, `fleet tmux --ensure`
  # adopts it as-is (reconcile only) — but that server is NOT in this unit's
  # cgroup until the next time the unit recreates it. Like the other units
  # this needs a real systemd PID 1: in the companion dev container only
  # syntax-check + lint apply.
  ansible.builtin.systemd:
    name: fleet-tmux.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [fleet_tmux]
