---
# ddev-fleet Ansible variables (spec §3.2, §16).
#
# Every variable below is a single-change knob. Items flagged "AWAITS
# CONFIRMATION" are provisional defaults carried over from the design
# spec's worked example and MUST be confirmed (or overridden here) before
# a real server rollout — see docs/runbook-server-rollout.md.

# --- OS assumption ----------------------------------------------------------
# Roles use ansible.builtin.apt and target a Debian-family host. Verified
# live on Ubuntu 26.04 LTS (codename "resolute") on 2026-07-13:
#   - docker-ce publishes a resolute dist, but ONLY under the /ubuntu vendor
#     path — /debian/dists/resolute is 404. docker_apt_repo below therefore
#     derives the vendor segment from `ansible_distribution` (debian|ubuntu)
#     so the same role works on Debian 13 and Ubuntu without edits.
#   - caddy uses the codename-independent `any-version` dist (OS-agnostic).
#   - ddev uses a wildcard-suite flat repo (OS-agnostic).
os_family_assumption: "Debian-family (verified: Ubuntu 26.04 / resolute)"

# --- fleet user & filesystem (spec §2, §3.3) --------------------------------
fleet_user: fleet
fleet_group: fleet
fleet_home_dir: /home/fleet
fleet_srv_dir: /srv/fleet
fleet_opt_dir: /opt/ddev-fleet

# --- fleet daemon (spec §3.4, §13) ------------------------------------------
fleet_daemon_port: 8765

# --- DDEV router (spec §9.2) -------------------------------------------------
ddev_router_http_port: 8080
ddev_router_https_port: 8443
ddev_typesense_http_port: 8108
# Public port Caddy exposes each instance's Typesense on for direct browser
# access (spec: typesense edge exposure). MUST match
# fleet.core.instances.TYPESENSE_PUBLIC_PORT in the Python codebase.
fleet_typesense_public_port: 9108

# --- Domain & TLS (spec §9) — AWAITS CONFIRMATION ---------------------------
# fleet_domain already includes the "fleet." label (it matches fleet.yml's
# own `fleet.domain` field and the worked example FQDNs, e.g.
# oak--develop.fleet.personal.example — spec §4.2/§7.3). The caddy role's
# Caddyfile template therefore vhosts on `{{ fleet_domain }}` and
# `*.{{ fleet_domain }}` directly, NOT `fleet.{{ fleet_domain }}` — see
# this plan's "Judgment call flagged up front" note.
fleet_domain: fleet.personal.example
acme_email: contact@personal.example

# --- Caddy admin auth (spec §9.3) -------------------------------------------
# The admin-auth Caddyfile snippet is fleet-owned and rotatable WITHOUT
# Ansible: fleet.core.caddyauth + `fleet set-admin-password` / `fleet
# rotate-admin-password` hash, write, validate, and reload Caddy directly
# (see ansible/roles/caddy/tasks/main.yml + templates/Caddyfile.j2). Ansible's
# only job is to SEED {{ fleet_caddy_snippet_dir }}/admin-auth.conf with the
# distribution-default credentials on first provisioning — the seed task is
# guarded so a re-run NEVER clobbers a snippet that's already there
# (including one rotated in the meantime). Rotate the default immediately
# after rollout — see README.md "Default credentials".
fleet_admin_user: admin
fleet_admin_default_password: ddev-admin
fleet_caddy_snippet_dir: /etc/caddy/fleet

# --- Product repo (spec §3.1, §17) — AWAITS CONFIRMATION --------------------
fleet_repo_url: https://bitbucket.org/personal_maintainer/ddev-fleet.git
fleet_repo_version: main
# When true, the code is delivered out-of-band (e.g. rsync/tar of a clean
# checkout to fleet_opt_dir) and BOTH fetch points — bootstrap.sh and the
# fleet_service git task — are skipped, so no server-side git auth is needed
# for a private repo. bootstrap.sh sets this via `-e fleet_skip_fetch=true`
# when it is run with FLEET_SKIP_FETCH=1.
fleet_skip_fetch: false

# --- Package repos (pinned upstream URLs; package versions float to latest
# stable at apply time, per spec §3 — no version pinning requirement) ------
# Vendor segment derived from the running distro (debian|ubuntu) — docker-ce
# publishes per-vendor paths and a codename only exists under its own vendor.
docker_apt_repo: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
ddev_apt_repo: "https://pkg.ddev.com/apt/"
caddy_apt_repo: "https://dl.cloudsmith.io/public/caddy/stable/deb/debian"
