---
# ddev-fleet Ansible variables (spec §3.2, §16).
#
# Every variable below is a single-change knob. `fleet_domain`, `acme_email`,
# and `fleet_admin_default_password` have no public-safe default and MUST be
# supplied via /etc/ddev-fleet/local-vars.yml (written by bootstrap.sh's
# value-collection phase) before a real server rollout — see
# docs/installation.md.

# --- OS assumption ----------------------------------------------------------
# Roles use ansible.builtin.apt and target a Debian-family host. Verified
# live on Ubuntu 26.04 LTS (codename "resolute") on 2026-07-13:
#   - docker-ce publishes a resolute dist, but ONLY under the /ubuntu vendor
#     path — /debian/dists/resolute is 404. docker_apt_repo below therefore
#     derives the vendor segment from `ansible_distribution` (debian|ubuntu)
#     so the same role works on Debian 13 and Ubuntu without edits.
#   - caddy uses the codename-independent `any-version` dist (OS-agnostic).
#   - ddev uses a wildcard-suite flat repo (OS-agnostic).
os_family_assumption: "Debian-family (verified: Ubuntu 26.04 / resolute)"

# --- fleet user & filesystem (spec §2, §3.3) --------------------------------
fleet_user: fleet
fleet_group: fleet
fleet_home_dir: /home/fleet
fleet_srv_dir: /srv/fleet
fleet_opt_dir: /opt/ddev-fleet

# --- fleet daemon (spec §3.4, §13) ------------------------------------------
fleet_daemon_port: 8765

# --- DDEV router (spec §9.2) -------------------------------------------------
ddev_router_http_port: 8080
ddev_router_https_port: 8443
# NOTE: ddev_typesense_http_port / fleet_typesense_public_port were removed
# 2026-07-24 (2026-07-24-fleet-port-exposure-design.md) — Typesense's public
# port is no longer an Ansible var hand-synced against a Python constant.
# It is now `fleet.ports.typesense` in fleet.yml (default 9108/8108 via
# Registry.port_profile()'s legacy fallback, core/registry.py), reconciled
# into Caddy by fleet.core.caddyports — see docs/networking.md.

# --- Domain & TLS (spec §9) --------------------------------------------------
# fleet_domain already includes the "fleet." label (it matches fleet.yml's
# own `fleet.domain` field and the worked example FQDNs, e.g.
# oak--develop.fleet.example.com — spec §4.2/§7.3). The caddy role's
# Caddyfile template therefore vhosts on `{{ fleet_domain }}` and
# `*.{{ fleet_domain }}` directly, NOT `fleet.{{ fleet_domain }}` — see
# this plan's "Judgment call flagged up front" note.
#
# fleet_domain keeps a harmless placeholder default so a bare
# `ansible-playbook site.yml` (e.g. the companion's in-container
# syntax-check gate) never errors on an undefined var. acme_email gets NO
# default — Let's Encrypt needs a real reachable address, and a placeholder
# would silently produce a useless one — it is REQUIRED, supplied via
# bootstrap.sh's value-collection phase into /etc/ddev-fleet/local-vars.yml.
fleet_domain: fleet.example.com
acme_email: "{{ undef(hint='acme_email is required — set it via bootstrap.sh or /etc/ddev-fleet/local-vars.yml') }}"

# --- Caddy admin auth (spec §9.3) -------------------------------------------
# The admin-auth Caddyfile snippet is fleet-owned and rotatable WITHOUT
# Ansible: fleet.core.caddyauth + `fleet set-admin-password` / `fleet
# rotate-admin-password` hash, write, validate, and reload Caddy directly
# (see ansible/roles/caddy/tasks/main.yml + templates/Caddyfile.j2). Ansible's
# only job is to SEED {{ fleet_caddy_snippet_dir }}/admin-auth.conf with the
# distribution-default credentials on first provisioning — the seed task is
# guarded so a re-run NEVER clobbers a snippet that's already there
# (including one rotated in the meantime). Rotate the default immediately
# after rollout — see README.md "Default credentials".
fleet_admin_user: admin
# NO PUBLIC-SAFE DEFAULT: fleet_admin_default_password must come from
# /etc/ddev-fleet/local-vars.yml (bootstrap.sh's value-collection phase
# generates a random one, or an operator sets FLEET_ADMIN_PASSWORD /
# answers the prompt). The caddy role's seed task fails fast with an
# actionable message if it's still unset when the snippet doesn't exist yet
# (see ansible/roles/caddy/tasks/main.yml).
fleet_caddy_snippet_dir: /etc/caddy/fleet

# --- TLS certificate mode (docs/installation.md "Choosing a TLS mode") -----
# How Caddy gets Let's Encrypt certificates for `*.{{ fleet_domain }}` and
# every named-port site (core/caddyports.py). Two allowed values (asserted
# in the caddy role — an unrecognised value fails fast with a clear
# message):
#
#   on_demand (default): one cert per exact hostname, issued the first time
#     it's requested, authorized via HTTP-01 through /api/tls-authorize. No
#     setup. Limited to ~50 NEW certs per registered domain per rolling 7
#     days (Let's Encrypt's "Certificates per Registered Domain" rate
#     limit) — can bite a project with many instances/aliases.
#
#   ovh_dns: ONE wildcard cert for *.{{ fleet_domain }} via the DNS-01
#     challenge, with Caddy writing the _acme-challenge TXT record through
#     the OVH API (caddy-dns/ovh plugin, requires a custom Caddy build —
#     see the caddy role). No per-hostname limit. OVH is currently the only
#     supported DNS provider; a future provider would be a new mode named
#     `<provider>_dns`, following the same pattern.
#
# Persisted per host in /etc/ddev-fleet/local-vars.yml (bootstrap.sh's
# "TLS certificates" prompt), like fleet_domain. Switching an existing
# server's mode: edit local-vars.yml, then (for ovh_dns) create
# /etc/caddy/ovh.env, then re-run `ansible/caddy-only.yml` — see
# docs/installation.md.
fleet_tls_mode: on_demand

# --- OVH DNS-01 (ovh_dns mode only; ignored otherwise) ----------------------
# Ansible NEVER writes the credential file's CONTENTS (see the caddy role) —
# it only asserts /etc/caddy/ovh.env exists with all four keys and fixes its
# owner/group/mode. The operator creates it (bootstrap.sh prompts for the
# values and writes it 0600 root:root; the caddy role then re-owns it
# 0640 root:caddy so Caddy's systemd EnvironmentFile= can read it).
fleet_ovh_env_file: /etc/caddy/ovh.env

# --- Product repo (spec §3.1, §17) -------------------------------------------
fleet_repo_url: https://github.com/rcuny/ddev-fleet.git
fleet_repo_version: main
# When true, the code is delivered out-of-band (e.g. rsync/tar of a clean
# checkout to fleet_opt_dir) and BOTH fetch points — bootstrap.sh and the
# fleet_service git task — are skipped, so no server-side git auth is needed
# for a private repo. bootstrap.sh sets this via `-e fleet_skip_fetch=true`
# when it is run with FLEET_SKIP_FETCH=1.
fleet_skip_fetch: false

# --- Auth mode (docs/README-authelia.md) -----------------------------------
# basic (default): today's per-instance HTTP basic auth, symmetric
# username==password, rotatable without Ansible (fleet.core.caddyauth).
# authelia: a cookie-based login portal (Authelia, systemd service) that
# works on networks blocking basic auth outright; per-project users come
# from fleet.yml's users: (fleet.core.authelia). See
# docs/README-authelia.md for the full design and how to switch modes on
# an existing server (ansible/authelia.yml).
fleet_auth_mode: basic

# --- Package repos (pinned upstream URLs; package versions float to latest
# stable at apply time, per spec §3 — no version pinning requirement) ------
# Vendor segment derived from the running distro (debian|ubuntu) — docker-ce
# publishes per-vendor paths and a codename only exists under its own vendor.
docker_apt_repo: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
ddev_apt_repo: "https://pkg.ddev.com/apt/"
caddy_apt_repo: "https://dl.cloudsmith.io/public/caddy/stable/deb/debian"
