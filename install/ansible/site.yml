---
# FLE-241 spike: host provisioning as Ansible roles (packages, docker, hardening).
# Run on the host itself:  ansible-playbook -i localhost, -c local site.yml [--check --diff] [-e @host-vars.yml]
- name: Provision a ddev-fleet host
  hosts: all
  become: true
  gather_facts: true
  vars:
    fleet_host_vars_file: /etc/ddev-fleet/host-vars.yml
  pre_tasks:
    - name: Refuse anything but Debian 13
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '13'
        fail_msg: ddev-fleet hosts are Debian 13 (trixie)
      tags: [always]

    - name: Look for the host's own answers
      ansible.builtin.stat:
        path: "{{ fleet_host_vars_file }}"
      register: fleet_host_vars_stat
      tags: [always]

    - name: Load the host's own answers
      ansible.builtin.include_vars:
        file: "{{ fleet_host_vars_file }}"
      when: fleet_host_vars_stat.stat.exists
      tags: [always]
  roles:
    - role: packages
      tags: [packages]
    - role: docker
      tags: [docker]
    - role: fleet_user
      tags: [fleet_user]
    - role: shell
      tags: [shell]
    - role: ddev
      tags: [ddev]
    - role: hardening
      when: fleet_hardening_enabled | bool
      tags: [hardening]
