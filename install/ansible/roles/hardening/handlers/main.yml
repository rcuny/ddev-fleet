---
- name: Reload sshd
  ansible.builtin.command: systemctl try-reload-or-restart ssh  # noqa: command-instead-of-module
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: ansible_facts['services']['systemd-resolved.service']['state'] | default('') == 'running'

- name: Load sysctl
  ansible.builtin.command: sysctl -q -p /etc/sysctl.d/60-fleet-hardening.conf
  changed_when: true

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  register: hardening_augen
  changed_when: true
  failed_when: false

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true
  when: hardening_ufw_active | default(false)
