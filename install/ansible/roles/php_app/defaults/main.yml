---
# Keys of fleet.env, in the order they are added. Only MISSING keys are added; "@secret" is 64 random hex characters,
# generated once. A value an operator changed stays.
php_app_env_keys:
  - {key: APP_ENV, value: prod}
  - {key: APP_DEBUG, value: "0"}
  - {key: APP_SECRET, value: "@secret"}
  - {key: MERCURE_JWT_SECRET, value: "@secret"}
  - {key: MERCURE_SUBSCRIBER_JWT_SECRET, value: "@secret"}
  - {key: FLEET_PROXY_SECRET, value: "@secret"}
  - {key: FLEET_HOME, value: "{{ fleet_srv_dir }}"}
  - {key: FLEET_RUNNER, value: process}
  - {key: FLEET_TRUSTED_PROXIES, value: ""}
  - {key: FLEET_ADMIN_GROUP, value: fleet-admins}
  - {key: FLEET_CADDY_DIR, value: "{{ fleet_caddy_fleet_dir }}"}
  - {key: FLEET_JOB_RETENTION_DAYS, value: "90"}
  - {key: DEFAULT_URI, value: "https://{{ fleet_domain }}"}
php_app_env_header: |-
  # Generated by the ddev-fleet installer. Read by systemd (EnvironmentFile) and by the fleet command. A re-run only adds
  # keys that are missing; edit a value here and the installer keeps it.
