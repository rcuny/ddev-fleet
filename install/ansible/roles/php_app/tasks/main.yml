---
# Port of install/steps/70-env.sh (the environment files) and the php-fpm part of 95-units.sh. Nothing is started here.
- name: Refuse a run without the host's domain and release ref
  ansible.builtin.assert:
    that:
      - fleet_domain | length > 0
      - fleet_ref | length > 0
    fail_msg: set fleet_domain (host-vars.yml) and fleet_ref (-e fleet_ref=<tag or ref>)
  tags: [always]

- name: The settings directory
  ansible.builtin.file:
    path: "{{ fleet_etc_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ fleet_user }}"

- name: Look for fleet.env
  ansible.builtin.stat:
    path: "{{ fleet_etc_dir }}/fleet.env"
  register: php_app_env_stat

- name: Read the current fleet.env
  ansible.builtin.slurp:
    src: "{{ fleet_etc_dir }}/fleet.env"
  register: php_app_env_raw
  when: php_app_env_stat.stat.exists

- name: Remember which keys exist
  ansible.builtin.set_fact:
    php_app_env_existing: "{{ (php_app_env_raw.content | b64decode) if php_app_env_stat.stat.exists else '' }}"
  no_log: true

- name: The header of a new fleet.env
  ansible.builtin.copy:
    content: "{{ php_app_env_header }}\n"
    dest: "{{ fleet_etc_dir }}/fleet.env"
    force: false
    mode: "0640"
    owner: root
    group: "{{ fleet_user }}"

- name: Add the keys that are missing
  ansible.builtin.lineinfile:
    path: "{{ fleet_etc_dir }}/fleet.env"
    create: true
    line: "{{ item.key }}={{ item.value if item.value != '@secret' else lookup('ansible.builtin.password', '/dev/null chars=digits,abcdef length=64') }}"
    mode: "0640"
    owner: root
    group: "{{ fleet_user }}"
  loop: "{{ php_app_env_keys }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (php_app_env_existing is search('^' ~ item.key ~ '=', multiline=True))
  register: php_app_env_add
  no_log: true

- name: Note whether the environment changed
  ansible.builtin.set_fact:
    fleet_env_changed: "{{ php_app_env_add.results | selectattr('changed') | list | length > 0 or not php_app_env_stat.stat.exists }}"

- name: Read the file again for the domain and the Mercure secret
  ansible.builtin.slurp:
    src: "{{ fleet_etc_dir }}/fleet.env"
  register: php_app_env_now
  failed_when: false
  no_log: true

- name: Pick DEFAULT_URI and MERCURE_JWT_SECRET (the last assignment wins, like a shell sourcing the file)
  ansible.builtin.set_fact:
    php_app_uri: "{{ (php_app_env_now.content | default('') | b64decode | regex_findall('(?m)^DEFAULT_URI=(.*)$')) | last | default('') }}"
    php_app_mercure_secret: "{{ (php_app_env_now.content | default('') | b64decode | regex_findall('(?m)^MERCURE_JWT_SECRET=(.*)$')) | last | default('') }}"
  no_log: true

- name: Warn about a DEFAULT_URI that is not this host's domain (kept)
  ansible.builtin.debug:
    msg: >-
      DEFAULT_URI in {{ fleet_etc_dir }}/fleet.env is {{ php_app_uri }}, not https://{{ fleet_domain }}; kept
      (edit it by hand after a domain change)
  when: php_app_uri | length > 0 and php_app_uri != 'https://' ~ fleet_domain

- name: The Mercure secret must be usable
  ansible.builtin.assert:
    that: php_app_mercure_secret is match('^[A-Za-z0-9._~+/=-]{32,}$')
    fail_msg: MERCURE_JWT_SECRET in {{ fleet_etc_dir }}/fleet.env is missing or unusable
  when: not ansible_check_mode
  no_log: true

- name: The Mercure hub's keys, derived from the same secret (rewritten every run, so it never drifts)
  ansible.builtin.copy:
    content: |
      # Generated by the ddev-fleet installer from MERCURE_JWT_SECRET in fleet.env.
      MERCURE_PUBLISHER_JWT_KEY={{ php_app_mercure_secret }}
      MERCURE_SUBSCRIBER_JWT_KEY={{ php_app_mercure_secret }}
    dest: "{{ fleet_etc_dir }}/mercure.env"
    mode: "0600"
    owner: root
    group: root
  when: php_app_mercure_secret | length > 0
  register: php_app_mercure_env
  no_log: true

# --- php-fpm: the fleet pool is the only pool ---------------------------------------------------------------------
- name: The fleet pool
  ansible.builtin.copy:
    src: "{{ fleet_install_dir }}/etc/php-fpm-fleet.conf"
    dest: "{{ fleet_php_fpm_dir }}/pool.d/fleet.conf"
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  register: php_app_pool

- name: Look for the stock pool
  ansible.builtin.stat:
    path: "{{ fleet_php_fpm_dir }}/pool.d/www.conf"
  register: php_app_www

- name: Disable the stock pool
  ansible.builtin.command:
    argv: [mv, -f, "{{ fleet_php_fpm_dir }}/pool.d/www.conf", "{{ fleet_php_fpm_dir }}/pool.d/www.conf.disabled"]
  changed_when: true
  when: php_app_www.stat.exists

- name: The fleet php.ini settings
  ansible.builtin.copy:
    src: "{{ fleet_install_dir }}/etc/php-fleet.ini"
    dest: "{{ fleet_php_fpm_dir }}/conf.d/90-fleet.ini"
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  register: php_app_ini

- name: The php-fpm unit drop-in directory
  ansible.builtin.file:
    path: "{{ fleet_systemd_dir }}/php8.4-fpm.service.d"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: The php-fpm unit drop-in (loads fleet.env, lets the pool write /etc/caddy and /etc/authelia)
  ansible.builtin.copy:
    src: "{{ fleet_install_dir }}/etc/php-fpm-env.conf"
    dest: "{{ fleet_systemd_dir }}/php8.4-fpm.service.d/fleet-env.conf"
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  register: php_app_dropin
  notify: Reload systemd units (app)

- name: Check the php-fpm configuration before anything uses it
  ansible.builtin.command: php-fpm8.4 --test
  changed_when: false
  check_mode: false
  when: php_app_pool is not changed or not ansible_check_mode

- name: Note what changed for the start logic
  ansible.builtin.set_fact:
    fleet_fpm_changed: "{{ php_app_pool is changed or php_app_ini is changed or php_app_dropin is changed or php_app_www.stat.exists }}"
    fleet_mercure_changed: "{{ php_app_mercure_env is changed }}"
