---
# Render as fleet, install as root. --stage leaves the files for the helper (the OVH credentials would otherwise sit in
# clear text in /srv/fleet). --no-reload: Caddy is not asked to load the new Caddyfile here (the helper validates the
# staged copy). Caddy's restart is decided in start.yml.
# `command` tasks are skipped in --check, so a drift report does not show the rendered configuration.
- name: Remember the certificates Caddy holds, so the instance sites keep each name that already has one
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - . "$1/lib/common.sh" && write_stored_certs "$2"
      - fleet-certs
      - "{{ fleet_install_dir }}"
      - "{{ fleet_caddy_fleet_dir }}/stored-certs.list"
  changed_when: false

- name: Render the configuration into the staging directory
  ansible.builtin.command:
    argv: >-
      {{ fleet_run_as + fleet_app_exec + ['php8.4', 'bin/console', 'fleet:host:render', '--gate=auto', '--no-reload',
      '--stage'] }}
  changed_when: false

- name: Look for the staged Authelia configuration
  ansible.builtin.stat:
    path: "{{ fleet_srv_dir }}/staging/authelia/configuration.yml"
  register: units_authelia_staged
  when: not ansible_check_mode

- name: Compare it with the installed one
  ansible.builtin.command:
    argv:
      - cmp
      - -s
      - "{{ fleet_srv_dir }}/staging/authelia/configuration.yml"
      - /etc/authelia/configuration.yml
  register: units_authelia_cmp
  failed_when: false
  changed_when: false
  when: not ansible_check_mode and units_authelia_staged.stat.exists

# The helper restarts Authelia every time (which ends every session), so it runs only when the configuration changed.
- name: Install the Authelia configuration through the root helper
  ansible.builtin.command:
    argv: ["{{ fleet_helper_dir }}/apply", authelia]
  changed_when: true
  when: not ansible_check_mode and units_authelia_staged.stat.exists and units_authelia_cmp.rc != 0

- name: Discard an identical staged Authelia configuration
  ansible.builtin.file:
    path: "{{ fleet_srv_dir }}/staging/authelia/configuration.yml"
    state: absent
  when: not ansible_check_mode and units_authelia_staged.stat.exists and units_authelia_cmp.rc == 0

- name: Look for the staged Caddyfile
  ansible.builtin.stat:
    path: "{{ fleet_srv_dir }}/staging/caddy/Caddyfile"
  register: units_caddy_staged
  when: not ansible_check_mode

- name: Compare it with the installed one
  ansible.builtin.command:
    argv:
      - cmp
      - -s
      - "{{ fleet_srv_dir }}/staging/caddy/Caddyfile"
      - "{{ fleet_caddy_etc_dir }}/Caddyfile"
  register: units_caddy_cmp
  failed_when: false
  changed_when: false
  when: not ansible_check_mode and units_caddy_staged.stat.exists

# The helper validates, installs atomically and reloads Caddy (a reload, not a restart; it schedules a restart itself
# when the proxy secret changed).
- name: Install the Caddy configuration through the root helper
  ansible.builtin.command:
    argv: ["{{ fleet_helper_dir }}/apply", caddy]
  changed_when: units_caddy_cmp.rc != 0
  when: not ansible_check_mode and units_caddy_staged.stat.exists
