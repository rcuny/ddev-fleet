---
# Port of the former bash step 95-units.sh (the unit files and the Mercure hub, written but not started) and
# 98-render-start.sh (render the Caddy and Authelia configuration, start, wait until healthy, record the version).
- name: Unit files
  ansible.builtin.import_tasks: files.yml

- name: The Mercure hub
  ansible.builtin.import_tasks: mercure.yml

- name: Make systemd read what was written
  ansible.builtin.meta: flush_handlers

- name: Render the Caddy and Authelia configuration and install it through the root helper
  ansible.builtin.import_tasks: render.yml

- name: Enable and start the services
  ansible.builtin.import_tasks: start.yml

- name: Wait until the host answers, then record what is installed
  ansible.builtin.import_tasks: finish.yml
