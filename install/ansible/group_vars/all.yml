---
# Defaults only: nothing host-specific lives here (see host-vars.example.yml).
fleet_packages:
  - ca-certificates
  - gnupg
  - curl
  - git
  - sudo
  - acl
  - openssl
  - unzip
  - jq
  - openssh-client
  - libnss3-tools
  - iproute2
  - tmux
  - composer
  - php8.4-fpm
  - php8.4-cli
  - php8.4-opcache
  - php8.4-sqlite3
  - php8.4-intl
  - php8.4-mbstring
  - php8.4-xml
  - php8.4-curl
  - php8.4-zip

fleet_etc_dir: /etc/ddev-fleet
fleet_keyring_dir: /etc/apt/keyrings

# docker
fleet_docker_key_url: https://download.docker.com/linux/debian/gpg
fleet_docker_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
fleet_docker_pool_base: 10.64.0.0
fleet_docker_pool_prefix: 10
# Docker's built-in pools first (so existing networks stay valid), then the fleet pool is appended.
fleet_docker_builtin_pools:
  - {base: 172.17.0.0/16, size: 16}
  - {base: 172.18.0.0/16, size: 16}
  - {base: 172.19.0.0/16, size: 16}
  - {base: 172.20.0.0/16, size: 16}
  - {base: 172.21.0.0/16, size: 16}
  - {base: 172.22.0.0/16, size: 16}
  - {base: 172.23.0.0/16, size: 16}
  - {base: 172.24.0.0/16, size: 16}
  - {base: 172.25.0.0/16, size: 16}
  - {base: 172.26.0.0/16, size: 16}
  - {base: 172.27.0.0/16, size: 16}
  - {base: 172.28.0.0/16, size: 16}
  - {base: 172.29.0.0/16, size: 16}
  - {base: 172.30.0.0/16, size: 16}
  - {base: 172.31.0.0/16, size: 16}
  - {base: 192.168.0.0/16, size: 20}

# hardening (opt-in)
fleet_hardening_enabled: false
fleet_hardening_ssh_allow_users: []
fleet_hardening_trusted_ips: []
fleet_hardening_firewall_grace_minutes: 10
fleet_hardening_tmp: false
# Empty = ask sshd / ssh.socket. Set only to override.
fleet_hardening_ssh_ports: []
# true: refuse a lock-out (the account running this must have a key, nobody else with a key may be shut out).
# false: only warn (an unattended re-run such as an upgrade).
fleet_hardening_strict: true
# The account whose access must survive; empty = the user who called sudo, else the connecting user.
fleet_hardening_invoking_user: ""

# app layer (php_app, app_code, privileged, units). The release is checked out by the bootstrap; these roles assume
# the checkout in fleet_src_dir is at fleet_ref and that install/ (this tree's parent) is the root-owned export.
# The release ref the host is installed at (a tag, or a branch / commit). Required: it becomes installed-version.
fleet_ref: ""
# The host's public name and the ACME contact (host-vars.yml).
fleet_domain: ""
fleet_acme_email: ""
fleet_user: fleet
fleet_home_dir: /home/fleet
fleet_src_dir: /opt/ddev-fleet
fleet_srv_dir: /srv/fleet
fleet_caddy_etc_dir: /etc/caddy
fleet_caddy_fleet_dir: /etc/caddy/fleet
fleet_systemd_dir: /etc/systemd/system
fleet_helper_dir: /usr/local/libexec/fleet
fleet_sudoers_dir: /etc/sudoers.d
fleet_mercure_etc_dir: /etc/fleet-mercure
fleet_php_fpm_dir: /etc/php/8.4/fpm
# The root-owned export of install/: privileged files are installed from here, never from the fleet-writable checkout.
fleet_install_dir: "{{ playbook_dir | dirname }}"
# Seconds to wait for running jobs before the code is swapped (0 skips the wait), and for the health check.
fleet_job_wait: 300
fleet_health_timeout: 120
# true: rebuild (composer, assets, cache) even when neither the code nor the environment changed.
fleet_force_build: false
# true: restart Caddy (set by the role that refreshes its binary).
fleet_caddy_changed: false

# Pinned Mercure hub release (sha256 of the release archive per architecture).
fleet_mercure_version: 1.1.2
fleet_mercure_sha256:
  amd64: 64d67a1189c96c0131229e309679695086eca0d4cff0d14f9fef94f109438e30
  arm64: 60a016f6e838c888f76081944e0607500e8d9f1eb280db6812838714e67a3abb

# How to run something as the fleet user, and the application's console with fleet.env loaded (APP_ENV=prod).
fleet_run_as:
  - runuser
  - -u
  - "{{ fleet_user }}"
  - --
  - env
  - "HOME={{ fleet_home_dir }}"
  - DDEV_NONINTERACTIVE=true
fleet_app_exec:
  - bash
  - -c
  - set -a; . "$1"; set +a; cd "$2" && shift 2 && exec "$@"
  - fleet-app
  - "{{ fleet_etc_dir }}/fleet.env"
  - "{{ fleet_src_dir }}/app"
