# Installed by ddev-fleet (install/steps/50-caddy.sh). Drop-in for the Debian/Caddy package's caddy.service:
# sandboxes the one Internet-facing process. Exposure score 8.8 -> 1.6 in `systemd-analyze security`. Validated on a
# live server: `caddy validate`, binding a privileged port through the ambient capability, outbound HTTPS to Let's
# Encrypt, writes to /var/lib/caddy. CAP_NET_ADMIN is kept to match the vendor unit's own capability grant.
# Caddy only writes under /var/lib/caddy (certificates, autosave.json). If Caddy ever logs to files, add that
# directory to ReadWritePaths.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0027
