# Installed by ddev-fleet (install/steps/90-privileged.sh) as /etc/tmpfiles.d/ddev-fleet.conf.
# The upgrade history: root-owned and world-readable, appended only by the root helper (install/libexec/upgrade), so a
# restored database or the application user cannot rewrite it. `f` creates the file when missing and never truncates it.
d /var/log/ddev-fleet 0755 root root -
f /var/log/ddev-fleet/upgrade-history.jsonl 0644 root root -
