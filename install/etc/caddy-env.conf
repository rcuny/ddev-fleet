# Installed by ddev-fleet (install/steps/50-caddy.sh). The Caddyfile reads its secrets from the environment
# ({env.FLEET_PROXY_SECRET}, the OVH credentials); `apply caddy` writes this file (root:caddy 0640). The leading "-"
# keeps the unit startable before the file exists.
[Service]
EnvironmentFile=-/etc/caddy/fleet.env
