# Installed by ddev-fleet (the Ansible role caddy). The Caddyfile reads its secrets from the environment
# ({env.FLEET_PROXY_SECRET}); the OVH credentials are not here, they sit in /etc/caddy/ovh/ ({file.*}); `apply caddy` writes this file (root:caddy 0640). The leading "-"
# keeps the unit startable before the file exists.
[Service]
EnvironmentFile=-/etc/caddy/fleet.env
