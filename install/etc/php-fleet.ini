; Installed by ddev-fleet (install/steps/95-units.sh) as /etc/php/8.4/fpm/conf.d/90-fleet.ini.
expose_php = 0
opcache.enable = 1
; The code only changes through the installer, which reloads php-fpm and restarts the workers afterwards.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
