# Installed by ddev-fleet (install/steps/60-authelia.sh) as /etc/tmpfiles.d/authelia.conf, which masks the package's
# /usr/lib/tmpfiles.d/authelia.conf. That one has `Z /etc/authelia/* 0640 authelia authelia`, which systemd-tmpfiles
# applies recursively at every boot: it strips the execute bit of /etc/authelia/secrets and Authelia then cannot read
# its secrets. Keep only the directory line. Do not add `z` rules for the secrets: tmpfiles refuses them as an unsafe
# path transition.
e /etc/authelia 0755 authelia authelia -
