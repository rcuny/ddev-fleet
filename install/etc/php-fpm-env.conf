# Installed by ddev-fleet (install/steps/95-units.sh) as /etc/systemd/system/php8.4-fpm.service.d/fleet-env.conf.
[Service]
# The app's configuration (the pool has clear_env = no). systemd reads it when the unit starts: the installer restarts
# php-fpm when the file changed.
EnvironmentFile=/etc/ddev-fleet/fleet.env
# Debian's unit sets ProtectSystem=full, which mounts /etc read-only for the pool and for every child it starts, the
# sudo -> apply helper among them. The app writes /etc/caddy/fleet (the gate) and the helper installs into /etc/caddy
# and /etc/authelia.
ReadWritePaths=/etc/caddy /etc/authelia
# The pool calls `sudo -n apply`; a setuid binary only works without NoNewPrivileges. Debian's unit does not set it;
# this makes the requirement explicit.
NoNewPrivileges=no
