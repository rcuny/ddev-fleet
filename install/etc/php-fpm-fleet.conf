; Installed by ddev-fleet (install/steps/95-units.sh) as /etc/php/8.4/fpm/pool.d/fleet.conf. The stock www.conf is
; renamed to www.conf.disabled, so this is the only pool.
[fleet]
user = fleet
group = fleet

; Caddy (user caddy) connects here; the unix socket is the only way into the app.
listen = /run/php/fleet.sock
listen.owner = fleet
listen.group = caddy
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; The setup wizard's Finish request runs the root helper twice (60 s each), Authelia and Caddy validations and
; reloads: up to 240 s in the worst case (App\Setup\SetupFinisher::REQUIRED_REQUEST_TIMEOUT). Caddy's php_fastcgi
; has no read timeout of its own, so this is the only limit on the request.
request_terminate_timeout = 240
php_admin_value[max_execution_time] = 240

catch_workers_output = yes

; The variables of /etc/ddev-fleet/fleet.env reach the workers through the unit (php-fpm.service.d/fleet-env.conf).
clear_env = no
; Pinned, so that a fleet.env that lost APP_ENV can never give the dev kernel.
env[APP_ENV] = prod
; The master runs as root and its HOME (/root) would otherwise be inherited by everything a request starts
; (caddy, ssh-keygen, sudo): files created there would belong to root, not to fleet.
env[HOME] = /home/fleet
