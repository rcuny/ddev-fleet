# Installed by ddev-fleet host hardening (install --harden) as /etc/sysctl.d/60-fleet-hardening.conf.
# Deliberately conservative: it does NOT set net.ipv4.ip_forward=0 (Docker needs it) and does NOT tighten rp_filter
# (it breaks routing across the several Docker bridges DDEV creates).
kernel.dmesg_restrict = 1
net.ipv4.conf.all.log_martians = 1
