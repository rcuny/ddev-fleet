# Bitbucket Pipelines — the canonical CI for ddev-fleet (Bitbucket is the
# source of truth; GitHub is a read-only public mirror published from here).
#
# The product is a Symfony 8.1 app in app/ (PHP 8.4) with a Playwright browser
# suite in tests/playwright/; the Ansible roles, the systemd sandbox tests and
# the Renovate helper are kept from the 0.x line.
#
#   pull request (any branch)  -> in parallel: gates (php-cs-fixer, phpstan,
#                                 Twig/YAML/container lint, Doctrine schema,
#                                 phpunit, Playwright), infra tests (pytest for
#                                 the Ansible roles and tooling + the offline
#                                 systemd security check) and a non-blocking
#                                 ansible-lint/yamllint step
#   push to develop            -> the same three, then mirror develop to GitHub
#   push to feature/** release/** -> gates + infra tests (no mirror)
#   tag v*  (release)          -> gates + infra tests, then publish to the
#                                 GitHub mirror through ci/tag-guard.sh:
#                                 v1.X.Y must be on main (its tip also
#                                 fast-forwards GitHub's main); v0.X.Y must be
#                                 the tip of legacy and fast-forwards GitHub's
#                                 legacy. Anything else is
#                                 rejected.
#   custom: renovate           -> dependency-update PRs against develop
#                                 (composer, npm, pip requirements, Ansible
#                                 collections, pipeline images).
#                                 When it runs is decided ONLY here in
#                                 Bitbucket (Pipelines -> Schedules: branch
#                                 develop, custom: renovate, daily) or by a
#                                 manual run; renovate-config.json has no
#                                 schedule of its own.
#
# The gates run on Debian 13 (trixie) with PHP 8.4 from the distribution and
# Node 22 from NodeSource (@axe-core/playwright needs Node >= 22.12; Debian's
# own Node is 20). Playwright drives headless Chromium that the step installs
# with its system libraries. The infra step uses a Debian 13 Python image with
# systemd installed on purpose: the systemd security tests and
# `ci/systemd_security.py offline` score the 1.x unit files under install/ with
# systemd-analyze (same systemd 257 as the servers) and must not be skipped
# (FLEET_REQUIRE_SYSTEMD_ANALYZE=1). Reports land in reports/** as artifacts.
# Procedure and baseline updates: docs/contributing/ci.md.
#   custom: renovate-merge     -> merges ONE approved, green, up-to-date Renovate
#                                 PR into develop (scripts/renovate_merge.py),
#                                 then runs Renovate again so the remaining PRs
#                                 are recreated on the new develop. Renovate also
#                                 runs when nothing merged but an approved PR is
#                                 behind develop (FLE-11).
#                                 Started by hand or by the fleet daemon's
#                                 Bitbucket webhook relay; see
#                                 docs/README-renovate.md.
#
# Repository variables to configure (Repository settings -> Pipelines):
#   GITHUB_MIRROR_URL  SSH URL of the GitHub mirror repo (git@github.com:...).
#                      Unset/empty = the mirror steps skip, so forks stay inert.
#   GITHUB_COM_TOKEN   (secured) read-only GitHub token; lets Renovate fetch
#                      release notes without hitting anonymous rate limits.
#   RENOVATE_USERNAME  (secured) Atlassian account email used by Renovate.
#   RENOVATE_PASSWORD  (secured) Atlassian API token (repository read/write,
#                      pull requests read/write, read:user) for that account.
#                      custom: renovate-merge reuses both to merge the PR.
#   RENOVATE_MERGE_APPROVERS
#                      optional: comma-separated Bitbucket account ids whose
#                      Approve or "/merge" comment lets a PR merge. Default:
#                      the account behind RENOVATE_PASSWORD.
# Plus, under Repository settings -> Pipelines -> SSH keys: a key pair whose
# public half is a GitHub deploy key WITH WRITE ACCESS on the mirror repo.
# (github.com's host key is managed by Bitbucket itself: no "Known hosts"
# entry is needed, and adding one is refused.)
#
# Mirror pushes are never forced: if GitHub has diverged, the step fails
# loudly instead of rewriting public history.

image: debian:trixie # gates image; steps that need Python name their own python:*-trixie image

definitions:
  caches:
    composer-cache: ~/.cache/composer
    npm-cache: ~/.npm
  steps:
    - step: &gates
        name: Gates (php-cs-fixer, phpstan, lint, phpunit, Playwright)
        caches:
          - composer-cache
          - npm-cache
        script:
          # Bitbucket runners default to umask 000; keep files created by the build private to the group.
          - umask 022
          - export DEBIAN_FRONTEND=noninteractive COMPOSER_ALLOW_SUPERUSER=1 COMPOSER_NO_INTERACTION=1
          # PHP 8.4 and Composer come from Debian 13. git: Composer source fallbacks and the tag-guard tests
          # build real repositories. unzip: Composer. gnupg: NodeSource's key. openssh-client: ssh-keygen, which the
          # SSH key tests run for real. shellcheck: the installer scripts. sudo: visudo for the sudoers test. tmux: TmuxRealTest.
          - >-
            apt-get update -qq && apt-get install -y -qq --no-install-recommends
            php8.4-cli php8.4-sqlite3 php8.4-intl php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip
            composer git unzip curl ca-certificates gnupg openssh-client shellcheck sudo tmux > /dev/null
          # Node 22 for Playwright and @axe-core/playwright (>= 22.12); Debian 13's Node is 20.
          # pipefail: a failed download must stop the step, not feed an empty script to bash.
          - set -o pipefail
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null
          - apt-get install -y -qq --no-install-recommends nodejs > /dev/null
          - node -v && npm -v && php -v
          # No "? :" in a plain YAML scalar: ": " would turn the script item into a mapping.
          - node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
          - (cd app && composer install --no-interaction --prefer-dist)
          # Assets (importmap, Tailwind), php-cs-fixer, phpstan level 8, Twig/YAML/container lint, Doctrine
          # schema validation and phpunit (Unit, Integration, Functional, Repo).
          - (cd app && composer run gates)
          # Production build in a throw-away copy: composer install --no-dev, importmap, minified Tailwind,
          # asset-map:compile, prod cache warm-up, the boot guard and a php -S probe of /health and auth.
          - (cd app && composer run prod-check)
          # Browser E2E: Playwright starts the app itself (php -S, a throw-away FLEET_HOME) because
          # FLEET_E2E_BASE_URL is unset. It needs headless Chromium plus its system libraries (apt, as root)
          # and fails outright when the browser is missing. A subshell keeps the working directory at the root.
          - (cd tests/playwright && npm ci && npx playwright install --with-deps --only-shell chromium && npm run typecheck && npx playwright test)
        artifacts:
          - tests/playwright/test-results/**
          - tests/playwright/playwright-report/**
    # The Python side that survives the port: pytest for the Ansible roles, the systemd scoring and the Renovate
    # helper, plus the offline systemd security check.
    - step: &infra-tests
        name: Infra tests (pytest, systemd security)
        image: python:3.11-trixie # full Debian 13 image on purpose: the tests run real `git`
        caches:
          - pip
        script:
          # systemd-analyze warns about world-writable unit files, which the scoring tests treat as failure.
          - umask 022
          # systemd: systemd-analyze scores the rendered units (FLE-8)
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends systemd > /dev/null
          - pip install -q -r ci/requirements-dev.txt
          # The systemd scoring tests fail instead of skipping when systemd-analyze is missing.
          - FLEET_REQUIRE_SYSTEMD_ANALYZE=1 pytest -q tests/pytest
          - python ci/systemd_security.py offline --out reports/offline.json
          - >-
            python ci/systemd_security.py compare --env offline --current reports/offline.json
            --report-md reports/systemd-security-offline.md
            --report-json reports/systemd-security-offline.json
        artifacts:
          - reports/**
    # Replaces the GitHub Actions lint-ansible job. Non-blocking for now: the
    # cost/signal is not yet measured (open question,
    # 2026-07-24-fleet-open-source-release-design.md section 10); promote it to
    # a hard gate by dropping the `|| echo` once it is clean.
    - step: &ansible-lint
        name: Ansible lint (non-blocking)
        # ansible-core >= 2.21 (ci/requirements-infra.txt) needs Python >= 3.12.
        image: python:3.13-trixie
        caches:
          - pip
        script:
          - pip install -q -r ci/requirements-infra.txt || { echo "could not install ci/requirements-infra.txt (non-blocking)"; exit 0; }
          - ansible-lint ansible/ || echo "ansible-lint reported findings (non-blocking)"
          - yamllint ansible/ || echo "yamllint reported findings (non-blocking)"

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *gates
          - step: *infra-tests
          - step: *ansible-lint

  branches:
    develop:
      - parallel:
          - step: *gates
          - step: *infra-tests
          - step: *ansible-lint
      - step:
          name: Mirror develop to GitHub
          image: atlassian/default-image:5
          clone:
            depth: full
          script:
            - |
              if [ -z "${GITHUB_MIRROR_URL:-}" ]; then
                echo "GITHUB_MIRROR_URL not set, skipping mirror"
                exit 0
              fi
              git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"
              if [ "$(git rev-parse origin/develop)" != "$BITBUCKET_COMMIT" ]; then
                echo "newer develop exists, skipping (its own pipeline mirrors it)"
                exit 0
              fi
              git push "$GITHUB_MIRROR_URL" "$BITBUCKET_COMMIT:refs/heads/develop"

    "feature/**":
      - parallel:
          - step: *gates
          - step: *infra-tests

    "release/**":
      - parallel:
          - step: *gates
          - step: *infra-tests

  tags:
    "v*":
      - parallel:
          - step: *gates
          - step: *infra-tests
      - step:
          name: Publish release to GitHub mirror
          image: atlassian/default-image:5
          clone:
            depth: full
          script:
            - |
              set -eu
              if [ -z "${GITHUB_MIRROR_URL:-}" ]; then
                echo "GITHUB_MIRROR_URL not set, skipping mirror"
                exit 0
              fi
              git fetch origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/develop:refs/remotes/origin/develop" "+refs/heads/legacy:refs/remotes/origin/legacy" "+refs/tags/$BITBUCKET_TAG:refs/tags/$BITBUCKET_TAG"
              # ci/tag-guard.sh prints the refspecs this tag may publish, or fails:
              #   v1.X.Y must be on origin/main (the tip also fast-forwards GitHub's main, an older
              #   commit pushes only the tag);
              #   v0.X.Y must be the tip of origin/legacy and also fast-forwards GitHub's legacy.
              refspecs=$(ci/tag-guard.sh "$BITBUCKET_TAG" "$BITBUCKET_COMMIT") || exit 1
              if [ -z "$refspecs" ]; then
                echo "ERROR: the tag guard printed no refspec; refusing to push" >&2
                exit 1
              fi
              echo "publishing: $refspecs"
              git push "$GITHUB_MIRROR_URL" $refspecs

  custom:
    renovate:
      - step:
          name: Renovate
          # Renovate's own bitbucket-pipelines manager bumps this tag.
          # No pipeline cache on purpose: a daily run on one small repo is
          # cheap, and the image runs as a non-root user (cache dir ownership).
          image: renovate/renovate:44
          script:
            - RENOVATE_CONFIG_FILE="$BITBUCKET_CLONE_DIR/renovate-config.json" RENOVATE_REPOSITORIES="$BITBUCKET_REPO_FULL_NAME" renovate

    renovate-merge:
      - step:
          name: Merge an approved Renovate PR
          # scripts/renovate_merge.py is standard-library Python: the default image has no python3.
          image: python:3.13-trixie
          # One run at a time: a second run waits (FIFO) and then re-reads
          # develop, so two runs cannot merge two PRs onto the same head.
          concurrency-group: renovate-merge
          script:
            # Merges at most one PR. Writes the flag file (content = reason) only
            # when Renovate should run next: a PR was merged, or an approved PR
            # is behind develop and needs recreating.
            - python3 scripts/renovate_merge.py --renovate-flag renovate-requested.flag
          artifacts:
            - renovate-requested.flag
      - step:
          name: Renovate (when requested)
          image: renovate/renovate:44
          script:
            - |
              if [ ! -f renovate-requested.flag ]; then
                echo "Renovate not requested (no PR merged, no approved PR behind develop), skipping"
                exit 0
              fi
              echo "Renovate requested ($(cat renovate-requested.flag)); running it to recreate the PRs on the current develop"
              RENOVATE_CONFIG_FILE="$BITBUCKET_CLONE_DIR/renovate-config.json" RENOVATE_REPOSITORIES="$BITBUCKET_REPO_FULL_NAME" renovate
