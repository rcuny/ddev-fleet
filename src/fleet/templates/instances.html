{% extends "base.html" %}
{% block content %}
<form id="bulk-form">
<table id="instances-table">
  <thead>
    <tr>
      <th><input type="checkbox" id="select-all"></th>
      <th>Instance</th><th>Project</th><th>Branch</th><th>State</th>
      <th>URL</th><th>RAM (MiB)</th><th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for status in statuses %}
      {% include "partials/instance_row.html" %}
    {% endfor %}
  </tbody>
</table>

<div id="bulk-actions">
  <button type="button" hx-post="/ui/bulk/start" hx-include="#bulk-form"
          hx-target="#job-panel-slot" hx-swap="innerHTML">Start selected</button>
  <button type="button" hx-post="/ui/bulk/stop" hx-include="#bulk-form"
          hx-target="#job-panel-slot" hx-swap="innerHTML">Stop selected</button>
  <button type="button" id="bulk-destroy-trigger">Destroy selected</button>
  <div id="bulk-destroy-confirm" hidden>
    <p>Type <span id="bulk-destroy-count"></span> to confirm destroying
       <span id="bulk-destroy-count-2"></span> instances:</p>
    <input type="text" id="bulk-destroy-confirm-input">
    <input type="hidden" name="confirm_count" id="bulk-destroy-confirm-count-field" value="0">
    <button type="button" id="bulk-destroy-confirm-btn" disabled
            hx-post="/ui/bulk/destroy" hx-include="#bulk-form"
            hx-target="#job-panel-slot" hx-swap="innerHTML">Confirm destroy</button>
  </div>
</div>
</form>

<h2>Deploy</h2>
<form class="deploy-form" hx-post="/ui/deploy" hx-target="#job-panel-slot" hx-swap="innerHTML">
  <label>Project
    <select name="project" required>
      {% for key, templates in project_templates.items() %}
        <option value="{{ key }}">{{ key }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Template
    <select name="template" required>
      {% for key, templates in project_templates.items() %}
        {% for template in templates %}
          <option value="{{ template }}">{{ template }}</option>
        {% endfor %}
      {% endfor %}
    </select>
  </label>
  <label>Branch <input type="text" name="branch" required></label>
  <label>Label (optional) <input type="text" name="label"></label>
  <label>Count <input type="number" name="count" min="0" max="20" step="1" value="1" required></label>
  <label><input type="checkbox" name="fresh" value="true"> Fresh</label>
  <label><input type="checkbox" name="auth" value="true" checked> Basic auth</label>
  <label>Auth password <input type="text" name="auth_password" value="fleet"></label>
  <label><input type="checkbox" name="skip_disk_check" value="true"> Skip disk-space check</label>
  <button type="submit">Deploy</button>
</form>

<div id="job-panel-slot"></div>
{% endblock %}
