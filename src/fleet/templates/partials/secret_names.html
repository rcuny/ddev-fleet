<div id="secret-names"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if names %}
  <table class="secret-table">
    <thead><tr><th>Name</th><th>Stored as</th><th>Actions</th></tr></thead>
    <tbody>
      {% for name, kind in names %}
      <tr>
        <td><code>{{ name }}</code></td>
        <td>{% if kind == "encrypted" %}encrypted{% else %}plaintext (legacy; run <code>fleet secret migrate</code>){% endif %}</td>
        <td>
          <button type="button" class="destroy"
                  hx-post="/ui/secrets/{{ project|urlencode }}/{{ name|urlencode }}/delete"
                  hx-target="#secret-feedback" hx-swap="innerHTML"
                  hx-confirm="Delete secret {{ name }} from project {{ project }}?">Delete</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>No secrets are set for this project.</p>
  {% endif %}
</div>
