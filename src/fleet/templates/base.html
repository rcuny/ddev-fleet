<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ddev-fleet</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/ws-log.js" defer></script>
  <script src="/static/bulk.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #ddd; }
    form.deploy-form { margin: 1.5rem 0; display: flex; gap: 0.5rem; align-items: end; }
    .job-panel { margin-top: 1rem; border: 1px solid #ccc; padding: 0.8rem; }
    .job-log {
      background: #111; color: #0f0; font-family: monospace; padding: 0.6rem;
      height: 12rem; overflow-y: auto; white-space: pre-wrap;
    }
    button.destroy { color: #b00; }
    footer.sys-stats {
      margin-top: 2rem; padding-top: 0.8rem; border-top: 1px solid #ddd;
      color: #666; font-size: 0.85rem;
    }
    footer.sys-stats .mount { color: #999; }
  </style>
</head>
<body>
  <h1>ddev-fleet</h1>
  {% block content %}{% endblock %}
  {% if sys_stats %}
  <footer class="sys-stats">
    Server: {{ sys_stats.mem_free }} RAM free / {{ sys_stats.mem_total }} total
    &middot; {{ sys_stats.disk_free }} disk free / {{ sys_stats.disk_total }} total
    <span class="mount">on {{ sys_stats.mount }}</span>
  </footer>
  {% endif %}
</body>
</html>
