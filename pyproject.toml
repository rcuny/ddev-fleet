[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddev-fleet"
version = "0.8.0"
description = "Fleet manager for many DDEV-based projects on one host"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.19.1",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "black>=26.10.0",
    "httpx>=0.28.1",
]
infra = [
    "ansible-core>=2.21.5",
    "ansible-lint>=24.12.2",
    "yamllint>=1.38.0",
]

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet = ["static/*", "templates/*", "templates/partials/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]
