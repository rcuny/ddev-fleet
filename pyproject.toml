[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddev-fleet"
version = "0.1.0"
description = "Fleet manager for many DDEV-based projects on one host"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "httpx>=0.27",
]
infra = [
    "ansible-core>=2.16",
    "ansible-lint>=24.2",
    "yamllint>=1.35",
]

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]
